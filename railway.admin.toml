# Railway configuration for the letter-irl-admin service ONLY. Set this file's
# path in that service's settings ("Config-as-code file path"); railway.toml
# keeps applying to the API and maintenance services.
#
# No preDeployCommand on purpose. The migrator connects with DATABASE_URL and
# creates/reads the migrations table; under the admin reader or operator role
# those are permission failures, and the API and maintenance services already
# migrate on every deploy under the owner role (railway.toml).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.admin"

[deploy]
startCommand = "node dist/admin/server.js"
# Probed on the injected PORT against the health listener only. It answers
# 200 once the Tailscale node is Running, Serve is configured and the
# database identity checks passed; 503 until then.
healthcheckPath = "/healthz"
healthcheckTimeout = 180
# The supervisor exits non-zero when tailscaled dies; Railway restarts it.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 30
