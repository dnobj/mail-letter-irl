<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterPreviewCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-success: #065f46;
        --accent-success-bg: #d1fae5;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --preview-bg: #fefefe;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-success: #34d399;
        --accent-success-bg: #064e3b;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --preview-bg: #1e293b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .preview-pane {
        max-height: 200px;
        overflow: auto;
        padding: 1rem;
        background: var(--preview-bg);
        border-bottom: 1px solid var(--border-color);
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .preview-pane address {
        font-style: normal;
        margin-bottom: 1rem;
      }

      .preview-pane hr {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 1rem 0;
      }

      .meta {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
      }

      .info-label {
        color: var(--text-secondary);
      }

      .info-value {
        font-weight: 600;
        color: var(--text-primary);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .status-pill.ok {
        background: var(--accent-success-bg);
        color: var(--accent-success);
      }

      .status-pill.alert {
        background: var(--accent-warning-bg);
        color: var(--accent-warning);
      }

      .note {
        font-size: 0.85rem;
        color: var(--text-secondary);
        padding: 0.75rem;
        background: var(--bg-secondary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      /* Loading state */
      .loading .info-value,
      .loading .status-pill {
        background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--border-color) 50%, var(--bg-secondary) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        color: transparent;
        border-radius: 4px;
        min-width: 60px;
      }

      .loading .status-pill {
        min-width: 100px;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .preview-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100px;
        color: var(--text-secondary);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="preview-pane" id="preview-pane">
        <em>Loading preview...</em>
      </div>
      <div class="meta">
        <div class="info-row">
          <span class="info-label">Cost</span>
          <span class="info-value" id="cost"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Delivery</span>
          <span class="info-value" id="delivery"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="status-pill" id="status-pill"></span>
        </div>
        <div class="note" id="note" style="display: none;"></div>
      </div>
    </div>

    <script type="module">
      // Per OpenAI docs, data may not be available immediately
      // Must listen for 'openai:set_globals' event

      let dataLoaded = false;

      function showLoading() {
        const card = document.getElementById("card");
        card.classList.add("loading");

        // Show loading state
        document.getElementById("preview-pane").innerHTML =
          '<div class="preview-loading">Loading letter preview...</div>';
        document.getElementById("cost").textContent = "—";
        document.getElementById("delivery").textContent = "—";

        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        statusPill.textContent = "Loading...";

        document.getElementById("note").style.display = "none";
      }

      function render() {
        const state = window.openai?.toolOutput;

        // Check if we have actual data
        if (!state || state.draftId === undefined) {
          if (!dataLoaded) {
            showLoading();
          }
          return;
        }

        dataLoaded = true;
        const card = document.getElementById("card");
        card.classList.remove("loading");

        const {
          previewHtml,
          requiredCredits,
          canSendNow,
          reasonCannotSend,
          deliveryClass,
          estimatedDeliveryDays,
          savedReturnAddressNote
        } = state;

        // Render preview HTML
        const previewPane = document.getElementById("preview-pane");
        if (previewHtml) {
          const bodyMatch = previewHtml.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
          previewPane.innerHTML = bodyMatch ? bodyMatch[1] : previewHtml;
        } else {
          previewPane.innerHTML = "<em>No preview available</em>";
        }

        // Cost
        document.getElementById("cost").textContent =
          `${requiredCredits ?? 2} credit${requiredCredits === 1 ? "" : "s"}`;

        // Delivery info
        const deliveryText = [];
        if (deliveryClass) deliveryText.push(deliveryClass);
        if (estimatedDeliveryDays) deliveryText.push(`~${estimatedDeliveryDays} days`);
        document.getElementById("delivery").textContent =
          deliveryText.length > 0 ? deliveryText.join(" - ") : "Standard";

        // Status pill
        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        if (canSendNow) {
          statusPill.classList.add("ok");
          statusPill.textContent = "Ready to send";
        } else {
          statusPill.classList.add("alert");
          statusPill.textContent = reasonCannotSend ?? "Cannot send";
        }

        // Note about saved return address
        const noteEl = document.getElementById("note");
        if (savedReturnAddressNote) {
          noteEl.textContent = savedReturnAddressNote;
          noteEl.style.display = "block";
        } else {
          noteEl.style.display = "none";
        }
      }

      // Apply theme
      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      // Initial render (will show loading state)
      render();

      // Listen for data updates (per OpenAI docs)
      window.addEventListener("openai:set_globals", () => {
        render();
      });
    </script>
  </body>
</html>
