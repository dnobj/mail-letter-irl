<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterPreviewCard</title>
    <style>
      /* Letter IRL design system (widget-design-package, Aug 2026). The
         letter page is a paper artifact: cream in both themes - printed
         mail stays paper, and in dark mode the page is the hero. */
      :root{--sf:#fff;--sf2:#fafafa;--bd:#e4e4e7;--bd2:#f0f0f2;--tx:#111113;--tb:#3f3f46;--mut:#71717a;--faint:#a1a1aa;--pri:#111113;--prit:#fff;--ok:#16a34a;--okbg:#f0fdf4;--er:#dc2626;--erbg:#fef2f2}
      .dark{--sf:#2a2a2e;--sf2:#232327;--bd:#3a3a40;--bd2:#323238;--tx:#f4f4f5;--tb:#d4d4d8;--mut:#a1a1aa;--faint:#71717a;--pri:#f4f4f5;--prit:#111113;--ok:#34d399;--okbg:rgba(52,211,153,.13);--er:#f87171;--erbg:rgba(248,113,113,.12)}
      *{box-sizing:border-box}
      body{margin:0;padding:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tb)}
      .w{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;max-width:100%}
      .hd{display:flex;align-items:center;gap:7px;padding:11px 14px 10px;border-bottom:1px solid var(--bd2)}
      .logo{width:17px;height:11px;flex:none;display:block}
      /* One parametric SVG for both themes (assets/brand/letterirl-mark-small.svg):
         the mark reads --li-blue, which the dark scope lightens. */
      .dark{--li-blue:#6f98f2}
      .hd b{font-size:12.5px;font-weight:600;color:var(--tx)}
      .hd span.ctx{margin-left:auto;font-size:11.5px;color:var(--mut)}
      .bd{padding:14px}

      /* Letter page mockup - paper artifact, cream in both themes.
         Class names are generated by renderLetterMockup(). */
      .letter-mockup-container{display:flex;justify-content:center}
      .letter-mockup{width:222px;max-width:100%;aspect-ratio:8.5/11;background:#fdfcf8;border:1px solid #e6e0d2;border-radius:4px;box-shadow:0 2px 10px rgba(43,36,29,.12);overflow:hidden;display:flex;flex-direction:column;position:relative;color:#2b241d}
      .address-window{height:30%;background:rgba(128,113,90,.06);display:flex;flex-direction:column;justify-content:flex-start;padding:9px 11px;border-bottom:1px dashed #d9cdb8;position:relative}
      .return-address{font-family:Georgia,"Times New Roman",serif;font-size:6.5px;line-height:1.45;color:#8a7a64;text-transform:uppercase;letter-spacing:.02em}
      .recipient-address{font-family:Georgia,"Times New Roman",serif;font-size:7.5px;line-height:1.5;color:#2b241d;text-transform:uppercase;margin:9px 0 0 34%}
      .address-window-label{font-size:8px;color:#a8916b;text-transform:uppercase;letter-spacing:.08em;text-align:center;align-self:center;margin:auto}
      .letter-content{flex:1;padding:9px 13px;overflow:hidden;display:flex;flex-direction:column;font-family:Georgia,"Times New Roman",serif;font-size:7.8px;line-height:1.65;color:#3f3a33}
      .header-image-wrapper{width:100%;max-height:20%;margin-bottom:5px;display:flex;justify-content:center}
      .header-image-wrapper img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
      .body-text{overflow:hidden;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:20;-webkit-box-orient:vertical}
      .sign-off{margin-top:5px;white-space:pre-wrap;font-size:7.2px}
      .inline-image-wrapper{width:100%;max-height:25%;margin-top:5px;display:flex;justify-content:center}
      .inline-image-wrapper img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}

      /* Layout badge - production color semantics kept */
      .layout-badge{position:absolute;top:7px;right:7px;font-size:6.5px;font-weight:700;letter-spacing:.1em;padding:2.5px 7px;border-radius:4px;text-transform:uppercase;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .layout-badge.text-only{background:#e9e5dc;color:#6b5f4d}
      .layout-badge.header-image{background:#ede9fe;color:#6d28d9}
      .layout-badge.inline-image{background:#dcfce7;color:#15803d}

      /* Meta info rows */
      .meta{padding:0 14px 14px}
      .rows{margin:12px 0 0}
      .info-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--bd2);font-size:12.5px}
      .info-row:last-of-type{border-bottom:none}
      .info-label{color:var(--mut);flex:none}
      .info-value{color:var(--tx);font-weight:500;text-align:right}
      .info-value.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
      .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px}
      .status-pill.ok{color:var(--ok);background:var(--okbg)}
      .status-pill.alert{color:var(--er);background:var(--erbg)}

      .note{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--mut);line-height:1.45;margin-top:10px}

      /* Action buttons: primary ink pill (inverts in dark), secondary outline */
      .send-button{display:flex;width:100%;justify-content:center;align-items:center;gap:7px;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;box-sizing:border-box;border:none;margin-top:12px;background:var(--pri);color:var(--prit);transition:opacity .15s ease}
      .send-button:hover:not(:disabled){opacity:.88}
      .send-button:disabled{opacity:.45;cursor:not-allowed}
      .send-button.loading{pointer-events:none}
      .send-button .spinner{width:1rem;height:1rem;border:2px solid rgba(128,128,128,.35);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
      .purchase-actions{display:grid;gap:0}
      .send-button.secondary{color:var(--tx);background:transparent;border:1px solid var(--bd);margin-top:8px}
      .send-button.secondary:hover:not(:disabled){background:var(--sf2);opacity:1}
      .checkout-link{text-decoration:none}
      .checkout-link:hover{opacity:.9}
      @keyframes spin{to{transform:rotate(360deg)}}

      /* Success/Error states */
      .send-result{border-radius:8px;font-size:12px;line-height:1.5;text-align:center;padding:9px 11px;margin-top:11px}
      .send-result.success{background:var(--okbg);color:var(--ok)}
      .send-result.error{background:var(--erbg);border:1px solid rgba(220,38,38,.25);color:var(--er)}

      /* Loading shimmer */
      .loading .info-value,
      .loading .status-pill{background:linear-gradient(90deg,var(--bd2) 25%,var(--bd) 50%,var(--bd2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;color:transparent;border-radius:4px;min-width:60px}
      .loading .status-pill{min-width:100px}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      .preview-loading{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--faint);font-size:11.5px;width:100%}
      .rev{font-size:10px;opacity:.5;text-align:right;color:var(--mut);padding:0 14px 9px;margin:0}
    </style>
  </head>
  <body>
    <div class="w" id="card">
      <div class="hd"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 21"><path fill="none" stroke="var(--li-blue,#2563eb)" stroke-width="3" stroke-linejoin="round" d="M11.3 2.4c5.2 0 9.4 3.3 9.4 7.4 0 4.1-4.2 7.4-9.4 7.4-.8 0-1.6-.1-2.4-.2l-5.7 2.6 1.8-4.1C3 14.2 1.9 12 1.9 9.8c0-4.1 4.2-7.4 9.4-7.4Z"></path><g transform="rotate(-8 24 8.6)"><rect x="16.5" y="3" width="14.6" height="10" rx="1.6" fill="var(--li-orange,#f97316)"></rect><path fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" d="m18 4.7 5.8 4 5.8-4"></path></g></svg></span><b>Letter IRL</b><span class="ctx">Letter</span></div>
      <div class="bd">
        <div class="letter-mockup-container" id="mockup-container">
          <div class="preview-loading">Loading letter preview&hellip;</div>
        </div>
      </div>
      <div class="meta">
        <div class="rows">
          <div class="info-row">
            <span class="info-label">Layout</span>
            <span class="info-value" id="layout-type">&mdash;</span>
          </div>
          <div class="info-row">
            <span class="info-label">Cost</span>
            <span class="info-value" id="cost">&mdash;</span>
          </div>
          <div class="info-row">
            <span class="info-label">Delivery</span>
            <span class="info-value" id="delivery">&mdash;</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="status-pill" id="status-pill">Loading...</span>
          </div>
          <div class="info-row">
            <span class="info-label" id="id-label">Draft</span>
            <span class="info-value mono" id="id-value">&mdash;</span>
          </div>
        </div>
        <div class="note" id="note" style="display: none"></div>
        <!-- Send button - US-MCP-08 -->
        <button class="send-button" id="send-button" disabled>
          <span id="send-button-text">Send Letter</span>
        </button>
        <div
          class="purchase-actions"
          id="purchase-actions"
          style="display: none"
        >
          <button class="send-button" id="pay-send-button">
            <span id="pay-send-button-text">Pay &amp; Send</span>
          </button>
          <button class="send-button secondary" id="buy-pack-button">
            Buy a Letter Pack
          </button>
          <a
            class="send-button checkout-link"
            id="checkout-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            style="display: none"
          ></a>
          <button
            class="send-button secondary"
            id="check-status-button"
            style="display: none"
          >
            Check status
          </button>
          <div class="note">Checkout opens in your browser. Paying sends it automatically - this card updates when you return to this tab, or use Check status.</div>
        </div>
        <div
          id="error-message"
          class="send-result error"
          style="display: none"
        ></div>
      </div>
      <p class="rev">letter t17</p>
    </div>

    <script type="module">
      // Per OpenAI docs, data may not be available immediately
      // Must listen for 'openai:set_globals' event
      //
      // US-LAYOUT-05: Visual letter mockup with layout-aware rendering
      // US-MCP-08: Send button calls send_letter via callTool

      let dataLoaded = false;
      let currentDraftId = null;
      let currentEligibility = null;
      let sendInProgress = false;
      let checkoutInProgress = false;
      // Set once create_mail_checkout returns, and never cleared. Deliberately
      // not checkoutInProgress: that flag is reset when checkout CREATION
      // fails, and in that case render() should go back to owning the status
      // pill and the ID row. Those rows follow the order only once one exists.
      let trackedOrderId = null;
      let statusCheckInFlight = false;
      // Set when a Letter Pack checkout is opened. Unlike Pay & Send there is
      // no order id to follow - a pack is bought on the website, so the only
      // observable is the balance itself (#306).
      let packPurchasePending = false;
      // Letters reported by the most recent balance refresh, or null. render()
      // prefers this over the tool output's canSendNow, which is stale after a
      // pack purchase and which the model will not re-run.
      let refreshedLetters = null;
      let statusTimer = null;
      let pollStartedAt = 0;
      let pollDeadline = 0;

      function applyTheme() {
        const theme = window.openai?.theme ?? "light";
        document.documentElement.classList.toggle("dark", theme === "dark");
      }

      function escapeHtml(text) {
        if (!text) return "";
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function truncateText(text, maxLength) {
        if (!text || text.length <= maxLength) return text;
        return text.substring(0, maxLength) + "...";
      }

      function getLayoutBadgeClass(layoutType) {
        switch (layoutType) {
          case "header_image":
            return "header-image";
          case "inline_image":
            return "inline-image";
          default:
            return "text-only";
        }
      }

      function getLayoutLabel(layoutType) {
        switch (layoutType) {
          case "header_image":
            return "Header";
          case "inline_image":
            return "Inline";
          default:
            return "Text";
        }
      }

      function formatAddress(addr) {
        if (!addr) return null;
        const lines = [];
        if (addr.name) lines.push(addr.name);
        if (addr.addressLine1) lines.push(addr.addressLine1);
        if (addr.addressLine2) lines.push(addr.addressLine2);
        const cityLine = [addr.city, addr.state, addr.postalCode]
          .filter(Boolean)
          .join(", ")
          .replace(", ", ", ")
          .replace(/,([^,]*)$/, " $1");
        if (cityLine) lines.push(cityLine);
        return lines.join("<br>");
      }

      function renderLetterMockup(state) {
        const container = document.getElementById("mockup-container");
        const layoutType = state.layoutType || "text_only";

        // Get addresses from validation objects (already in output)
        const senderAddr = state.senderAddressValidation?.originalAddress;
        const recipientAddr = state.recipientAddressValidation?.originalAddress;

        // Get content from previewHtml fallback or direct fields
        let bodyText = "";
        let signOff = "";

        // Attempt to parse from previewHtml if direct fields not available
        const previewHtml =
          window.openai?.toolResponseMetadata?.previewHtml ?? state.previewHtml;
        if (previewHtml) {
          // Try to extract body
          const bodyMatch = previewHtml.match(
            /<div class="letter-body">([\s\S]*?)<\/div>/,
          );
          if (bodyMatch) {
            bodyText = bodyMatch[1].replace(/<[^>]+>/g, "").trim();
          }

          // Try to extract sign-off
          const signOffMatch = previewHtml.match(
            /<div class="sign-off">([\s\S]*?)<\/div>/,
          );
          if (signOffMatch) {
            signOff = signOffMatch[1].replace(/<[^>]+>/g, "").trim();
          }
        }

        // Fallback to raw body text display
        if (!bodyText && !signOff) {
          bodyText = "Letter preview";
        }

        // Build address window content
        const senderHtml = senderAddr ? formatAddress(senderAddr) : "";
        const recipientHtml = recipientAddr ? formatAddress(recipientAddr) : "";
        const hasAddresses = senderHtml || recipientHtml;

        // Build the mockup HTML
        let mockupHtml = `
          <div class="letter-mockup">
            <div class="layout-badge ${getLayoutBadgeClass(layoutType)}">${getLayoutLabel(layoutType)}</div>
            <div class="address-window">
              ${
                hasAddresses
                  ? `
                ${senderHtml ? `<div class="return-address">${senderHtml}</div>` : ""}
                ${recipientHtml ? `<div class="recipient-address">${recipientHtml}</div>` : ""}
              `
                  : `<span class="address-window-label">Address Window</span>`
              }
            </div>
            <div class="letter-content">
        `;

        // Header image (if applicable)
        // The compressed preview arrives in toolResponseMetadata, the same
        // channel as previewHtml above: partitionToolResult keeps widget-only
        // payloads out of the model's context. There is deliberately no
        // fallback to headerImageData - that field is dropped from BOTH
        // channels by design (it is the full-quality original, which the draft
        // holds), so reading it here only ever yielded undefined.
        const headerImage =
          window.openai?.toolResponseMetadata?.headerImagePreview ??
          state.headerImagePreview;
        if (layoutType === "header_image" && headerImage) {
          mockupHtml += `
            <div class="header-image-wrapper">
              <img src="${headerImage}" alt="Header">
            </div>
          `;
        }

        // Body text - show full content (already validated by character limits)
        mockupHtml += `<div class="body-text">${escapeHtml(bodyText)}</div>`;

        // Sign-off
        if (signOff) {
          mockupHtml += `<div class="sign-off">${escapeHtml(truncateText(signOff, 50))}</div>`;
        }

        // Inline image (if applicable). Same channel and same reasoning as the
        // header image above.
        const inlineImage =
          window.openai?.toolResponseMetadata?.inlineImagePreview ??
          state.inlineImagePreview;
        if (layoutType === "inline_image" && inlineImage) {
          mockupHtml += `
            <div class="inline-image-wrapper">
              <img src="${inlineImage}" alt="Photo">
            </div>
          `;
        }

        mockupHtml += `
            </div>
          </div>
        `;

        container.innerHTML = mockupHtml;
      }

      function showLoading() {
        const card = document.getElementById("card");
        card.classList.add("loading");

        // Show loading state
        document.getElementById("mockup-container").innerHTML =
          '<div class="preview-loading">Loading letter preview…</div>';
        document.getElementById("layout-type").textContent = "—";
        document.getElementById("cost").textContent = "—";
        document.getElementById("delivery").textContent = "—";

        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        statusPill.textContent = "Loading...";

        document.getElementById("note").style.display = "none";

        // Disable send button during loading
        const sendButton = document.getElementById("send-button");
        sendButton.disabled = true;
      }

      function render() {
        applyTheme();
        const state = window.openai?.toolOutput;

        // Check if we have actual data
        if (!state || state.draftId === undefined) {
          if (!dataLoaded) {
            showLoading();
          }
          return;
        }

        dataLoaded = true;
        const card = document.getElementById("card");
        card.classList.remove("loading");

        const {
          lettersRequired,
          canSendNow,
          reasonCannotSend,
          sendEligibility,
          deliveryClass,
          estimatedDeliveryDays,
          deliveryEstimate,
          deliveryDisclaimer,
          savedReturnAddressNote,
          draftId,
          layoutType,
        } = state;

        // Store draftId for send button
        currentDraftId = draftId;
        currentEligibility = sendEligibility || null;

        // Render the letter mockup (US-LAYOUT-05)
        renderLetterMockup(state);

        // Layout type
        const layoutLabels = {
          text_only: "Text Only",
          header_image: "Header Image",
          inline_image: "Inline Image",
        };
        document.getElementById("layout-type").textContent =
          layoutLabels[layoutType] || "Text Only";

        // Cost - lettersRequired is already in letters (1 letter = 1 standard letter)
        const letters = lettersRequired ?? 1;
        document.getElementById("cost").textContent =
          `${letters} Letter${letters === 1 ? "" : "s"}`;

        // Delivery info
        const deliveryText = [];
        if (deliveryClass) deliveryText.push(deliveryClass);
        if (deliveryEstimate) {
          deliveryText.push(deliveryEstimate);
        } else if (estimatedDeliveryDays) {
          deliveryText.push(`~${estimatedDeliveryDays} days`);
        }
        if (deliveryDisclaimer) deliveryText.push(deliveryDisclaimer);
        document.getElementById("delivery").textContent =
          deliveryText.length > 0 ? deliveryText.join(" - ") : "Standard";

        // A Letter Pack purchase changes the balance, but the model will not
        // re-run the quote - so a refreshed balance overrides the tool output's
        // canSendNow. Read HERE rather than painted onto the card by the pack
        // handler: render() stays the only thing that draws the card and stays
        // idempotent across arbitrary re-renders. Painting from a handler and
        // then guarding render() out of the way is what produced the defect
        // #305 had to fix (#306).
        //
        // Letters vs credits: the server decides on credits, this compares
        // letters. They agree exactly under flat pricing, which is pinned by
        // tests/unit/tools/letterBalanceEquivalence.test.ts - if that test
        // reddens, this line is what it is warning about.
        const effectiveCanSendNow =
          refreshedLetters !== null
            ? refreshedLetters >= (lettersRequired ?? 1)
            : canSendNow;

        // Status pill - only while this card still describes a draft.
        if (cardIsShowingDraft()) {
          const statusPill = document.getElementById("status-pill");
          statusPill.classList.remove("ok", "alert");
          if (effectiveCanSendNow) {
            statusPill.classList.add("ok");
            statusPill.textContent = "Ready to send";
          } else if (packPurchasePending) {
            // Neutral, not an alert: a pack purchase in flight is a normal
            // waiting state, and the pre-purchase "not enough letters" reads
            // as a failure once the customer has already paid.
            statusPill.textContent = "Waiting for your Letter Pack";
          } else {
            statusPill.classList.add("alert");
            statusPill.textContent = reasonCannotSend ?? "Cannot send";
          }
        }

        // Note about saved return address
        const noteEl = document.getElementById("note");
        if (savedReturnAddressNote) {
          noteEl.textContent = savedReturnAddressNote;
          noteEl.style.display = "block";
        } else {
          noteEl.style.display = "none";
        }

        // Show Draft ID - same ownership rule as the status pill above.
        if (cardIsShowingDraft()) {
          document.getElementById("id-label").textContent = "Draft";
          document.getElementById("id-value").textContent = draftId || "—";
        }

        // Update send button state
        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const purchaseActions = document.getElementById("purchase-actions");
        const paySendButton = document.getElementById("pay-send-button");
        const paySendButtonText = document.getElementById(
          "pay-send-button-text",
        );
        const buyPackButton = document.getElementById("buy-pack-button");

        if (!sendInProgress && !checkoutInProgress) {
          sendButton.style.display = effectiveCanSendNow ? "flex" : "none";
          sendButton.disabled = !effectiveCanSendNow;
          sendButtonText.textContent = "Send Letter";

          const payAndSend = sendEligibility?.payAndSend;
          const letterPack = sendEligibility?.letterPack;
          // Mirrors the server, which computes
          //   available = configured && (!prepaidEligible || allowedWithBalance)
          // with JIT_ALLOW_WITH_PREPAID_BALANCE off by default. In that
          // non-default config this hides an option the server would offer -
          // accepted deliberately, because the outcome it rules out is a
          // customer paying again for a letter they already own.
          const payAndSendAvailable =
            Boolean(payAndSend?.available) && !effectiveCanSendNow;
          purchaseActions.style.display =
            !effectiveCanSendNow || payAndSendAvailable ? "grid" : "none";
          paySendButton.style.display = payAndSendAvailable ? "flex" : "none";
          paySendButton.disabled = !payAndSendAvailable;
          if (payAndSendAvailable && payAndSend.amountCents) {
            paySendButtonText.textContent = `Pay & Send (${formatPayAmount(payAndSend)})`;
          }
          buyPackButton.style.display =
            !effectiveCanSendNow && letterPack?.available ? "flex" : "none";
        }
      }

      // Handle send button click - US-MCP-08
      async function handleSend() {
        if (sendInProgress || !currentDraftId) return;

        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const statusPill = document.getElementById("status-pill");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        const errorMessage = document.getElementById("error-message");

        // Hide any previous error
        errorMessage.style.display = "none";

        // Show loading state
        sendInProgress = true;
        sendButton.disabled = true;
        sendButton.classList.add("loading");
        sendButtonText.innerHTML = '<span class="spinner"></span> Sending...';

        try {
          // Call send_letter via OpenAI callTool
          const result = await window.openai.callTool("send_letter", {
            draftId: currentDraftId,
            confirm: true,
          });

          // Extract orderId - callTool may return different structures
          const orderId =
            result?.orderId ||
            result?.structuredContent?.orderId ||
            result?.content?.[0]?.text?.match(/Order ID: ([a-f0-9-]+)/i)?.[1] ||
            null;

          // Update status pill to show sent
          statusPill.classList.remove("ok", "alert");
          statusPill.classList.add("ok");
          statusPill.textContent = "Sent!";

          // Change Draft label to Order and show order ID
          idLabel.textContent = "Order";
          idValue.textContent = orderId || "Confirmed";

          // Update button to show success
          sendButton.classList.remove("loading");
          sendButtonText.innerHTML = "Letter Sent!";
          // Keep button disabled
        } catch (error) {
          // Show error message
          errorMessage.textContent = `Failed to send: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";

          // Reset button for retry
          sendButton.classList.remove("loading");
          sendButton.disabled = false;
          sendButtonText.textContent = "Retry Send";

          // Update status pill to alert state
          statusPill.classList.remove("ok");
          statusPill.classList.add("alert");
          statusPill.textContent = "Send failed";

          sendInProgress = false;
        }
      }

      function toolData(result) {
        return result?.structuredContent || result || {};
      }

      // True while this card still describes a draft. Once a send or a
      // checkout takes over, the status pill and the ID row belong to that
      // operation and render() must not write over them.
      //
      // This is the 2026-08-30 defect: both rows sat outside the guard that
      // already protected the buttons, so an openai:set_globals after a
      // successful payment reset a paid order's card to "Not enough letters in
      // your balance" and the draft id - reading, above a note promising
      // automatic updates, as though the payment had failed. The prepaid send
      // path had the same hole, which is why this covers sendInProgress too.
      function cardIsShowingDraft() {
        return trackedOrderId === null && !sendInProgress;
      }

      // Statuses after which nothing further will change, from the served
      // schema (src/zodSchemas.ts getPurchaseStatusOutputZ). "pending_payment"
      // and "processing" are the two worth waiting on.
      const TERMINAL_PURCHASE_STATUSES = [
        "sent",
        "payment_failed",
        "refund_pending",
        "refunded",
        "cancelled",
      ];
      const CHECK_STATUS_LABEL = "Check status";

      function applyPurchaseStatus(status) {
        const statusPill = document.getElementById("status-pill");
        const state = status.purchaseStatus;
        statusPill.classList.remove("ok", "alert");
        if (state === "sent") {
          statusPill.classList.add("ok");
          statusPill.textContent = "Sent!";
        } else if (state === "processing") {
          statusPill.classList.add("ok");
          statusPill.textContent = "Paid - preparing mail";
        } else if (TERMINAL_PURCHASE_STATUSES.includes(state)) {
          statusPill.classList.add("alert");
          statusPill.textContent = status.message || state;
        } else {
          statusPill.textContent = "Checkout open - waiting for payment";
        }
        return TERMINAL_PURCHASE_STATUSES.includes(state);
      }

      // One refresh, three callers: the Check status button, the visibility
      // handler, and the timer. The in-flight guard is what keeps them from
      // overlapping. Resolves true when the status is terminal.
      function lettersRequiredForDraft() {
        return window.openai?.toolOutput?.lettersRequired ?? 1;
      }

      async function refreshOrderStatus() {
        const status = toolData(
          await window.openai.callTool("get_purchase_status", {
            orderId: trackedOrderId,
          }),
        );
        const finished = applyPurchaseStatus(status);
        if (finished) stopStatusPolling();
        return finished;
      }

      // A Letter Pack grants letters; it does not send anything. So "finished"
      // here means the letters have arrived and the card can send - at which
      // point render() has taken over and there is nothing left to wait for.
      async function refreshLetterBalance() {
        const balance = toolData(
          await window.openai.callTool("get_account_balance", {}),
        );
        if (typeof balance.lettersRemaining !== "number") return false;
        refreshedLetters = balance.lettersRemaining;
        render();
        const enough = refreshedLetters >= lettersRequiredForDraft();
        if (enough) stopStatusPolling();
        return enough;
      }

      // One refresh, three callers: the Check status button, the visibility
      // handler, and the timer. The in-flight guard is what keeps them from
      // overlapping. Resolves true when there is nothing left to wait for.
      //
      // A tracked order wins over a pending pack: order state is the more
      // specific answer, and the pack path has no order id to ask about.
      async function refreshPurchaseStatus() {
        if (statusCheckInFlight) return false;
        if (!trackedOrderId && !packPurchasePending) return false;
        statusCheckInFlight = true;
        const button = document.getElementById("check-status-button");
        button.textContent = "Checking...";
        button.disabled = true;
        try {
          return trackedOrderId
            ? await refreshOrderStatus()
            : await refreshLetterBalance();
        } catch {
          // A failed check is not worth an alarming message: the purchase is
          // unaffected, and the button is still there to try again. This is
          // also the ordinary case when a pack was bought while signed out of
          // the website - the letters simply never arrive here.
          return false;
        } finally {
          statusCheckInFlight = false;
          button.textContent = CHECK_STATUS_LABEL;
          button.disabled = false;
        }
      }

      // Poll only while the document is visible, and refresh the instant it
      // becomes visible again.
      //
      // The previous loop ran 24 fixed 2.5s attempts and, on 2026-08-30, made
      // exactly ONE call. Paying means switching to the Stripe tab, and
      // browsers throttle or suspend timers in a hidden iframe - so a timer is
      // structurally unable to cover the window it exists for. Coming back to
      // the tab is both when the answer is wanted and the first moment the
      // widget is allowed to run, so that is what drives it. The visibility
      // gate is also what bounds call volume; the interval is secondary.
      const POLL_FAST_MS = 3000;
      const POLL_SLOW_MS = 15000;
      const POLL_FAST_WINDOW_MS = 60000;
      const POLL_BUDGET_MS = 600000;

      function stopStatusPolling() {
        if (statusTimer !== null) {
          clearTimeout(statusTimer);
          statusTimer = null;
        }
      }

      // Always clears before arming, so repeated visibilitychange events
      // cannot stack timers - a leak here would mean unbounded callTool
      // traffic from a card left open.
      function scheduleStatusPoll() {
        stopStatusPolling();
        if ((!trackedOrderId && !packPurchasePending) || document.hidden) return;
        if (Date.now() >= pollDeadline) return;
        const elapsed = Date.now() - pollStartedAt;
        const delay =
          elapsed < POLL_FAST_WINDOW_MS ? POLL_FAST_MS : POLL_SLOW_MS;
        statusTimer = setTimeout(() => {
          statusTimer = null;
          void refreshPurchaseStatus().then((finished) => {
            if (!finished) scheduleStatusPoll();
          });
        }, delay);
      }

      // pillText is passed only by flows that own the pill. The pack flow
      // passes nothing, because there cardIsShowingDraft() is still true and
      // render() is the thing that draws it.
      function startStatusPolling(pillText) {
        pollStartedAt = Date.now();
        pollDeadline = pollStartedAt + POLL_BUDGET_MS;
        document.getElementById("check-status-button").style.display = "flex";
        // Claim the pill immediately. Until the first poll returns there is
        // nothing else to show, and leaving the pre-checkout text - "Not
        // enough letters in your balance" - next to an open checkout reads as
        // a payment that failed.
        if (pillText) {
          const statusPill = document.getElementById("status-pill");
          statusPill.classList.remove("ok", "alert");
          statusPill.textContent = pillText;
        }
        scheduleStatusPoll();
      }

      // Server-formatted per currency. The fallback matters more than it
      // looks: a connector that has not re-ingested the tool schema strips
      // unknown fields, so displayAmount is absent on stale connections and
      // the fallback IS the display - make it currency-aware too (#278
      // round 7). Shared by the Pay & Send button and the checkout link so
      // the two can never quote different prices for the same order.
      function formatPayAmount(payAndSend) {
        const zeroDecimal = ['bif','clp','djf','gnf','jpy','kmf','krw','mga','pyg','rwf','ugx','vnd','vuv','xaf','xof','xpf'];
        const threeDecimal = ['bhd','jod','kwd','omr','tnd'];
        const ccy = String(payAndSend?.currency || 'usd').toLowerCase();
        const decimals = zeroDecimal.includes(ccy) ? 0 : threeDecimal.includes(ccy) ? 3 : 2;
        const amount =
          payAndSend?.displayAmount ||
          ((payAndSend?.amountCents || 0) / Math.pow(10, decimals)).toFixed(decimals);
        return `${ccy.toUpperCase()} ${amount}`;
      }

      // Reveal the checkout link, the customer's route to paying when the
      // host does not open a tab. See handlePayAndSend for why it exists.
      function showCheckoutLink(href, label) {
        const link = document.getElementById("checkout-link");
        link.href = href;
        link.textContent = label;
        link.style.display = "flex";
      }

      async function handlePayAndSend() {
        if (checkoutInProgress || !currentDraftId) return;
        const button = document.getElementById("pay-send-button");
        const buttonText = document.getElementById("pay-send-button-text");
        const errorMessage = document.getElementById("error-message");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        checkoutInProgress = true;
        errorMessage.style.display = "none";
        button.disabled = true;
        button.classList.add("loading");
        buttonText.innerHTML =
          '<span class="spinner"></span> Preparing checkout...';
        try {
          const result = toolData(
            await window.openai.callTool("create_mail_checkout", {
              draftId: currentDraftId,
            }),
          );
          if (!result.checkoutUrl) {
            throw new Error(result.message || "Checkout URL was not returned");
          }
          // Claim the rows BEFORE writing them, so a set_globals landing
          // between the two cannot reset them to the draft.
          trackedOrderId = result.orderId;
          idLabel.textContent = "Purchase";
          idValue.textContent = result.orderId;
          button.classList.remove("loading");

          // Show the link BEFORE handing off to the host, and never hide it
          // again. On 2026-08-29 openExternal resolved without opening
          // anything: the order sat at checkout_pending, the customer had no
          // way to reach Stripe, and the draft stayed blocked behind it by
          // DRAFT_CHECKOUT_PENDING until the window lapsed. Whether that was
          // the host or a popup blocker was never established, so this link
          // is deliberately chosen to be correct either way - and a click on
          // a real anchor is a user gesture in a way a window.open issued
          // after an awaited callTool is not.
          //
          // Deliberately NOT hidden on retry: a second create_mail_checkout
          // for the same draft comes back DRAFT_CHECKOUT_PENDING, so hiding
          // it would take away the only working way to pay.
          // No price rather than a wrong one: formatPayAmount falls back to
          // 0.00 on missing data, and a payment link is the last place to
          // show a made-up figure.
          const payAndSend = currentEligibility?.payAndSend;
          const priced = payAndSend?.amountCents
            ? ` (${formatPayAmount(payAndSend)})`
            : "";
          showCheckoutLink(result.checkoutUrl, `Open checkout${priced}`);

          // Start before opening, not after: the customer may well pay via
          // the link above, and this card has to update on that path too.
          startStatusPolling("Checkout open - waiting for payment");

          try {
            await window.openai.openExternal({ href: result.checkoutUrl });
            buttonText.textContent = "Checkout Opened";
          } catch {
            // The host declined to open a tab. Not an error worth showing as
            // one - the link is visible and polling is already running - so
            // point at it rather than claiming the checkout failed.
            buttonText.textContent = "Use the checkout link below";
          }
        } catch (error) {
          errorMessage.textContent = `Unable to open checkout: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";
          button.classList.remove("loading");
          button.disabled = false;
          buttonText.textContent = "Retry Pay & Send";
          checkoutInProgress = false;
        }
      }

      async function handleBuyPack() {
        const purchaseUrl = currentEligibility?.letterPack?.purchaseUrl;
        if (!purchaseUrl) return;
        // Same fallback as Pay & Send, lower stakes - a pack purchase is
        // recoverable from the website - but there is no reason to leave a
        // button that silently does nothing either. The await was previously
        // uncaught, so a rejection here became an unhandled rejection.
        showCheckoutLink(purchaseUrl, "Open Letter Pack checkout");
        // A pack only grants letters - the customer still has to come back and
        // press Send - so a card that never notices the letters arrived can
        // leave a paid-for letter unsent indefinitely. Same scheduler as Pay &
        // Send; only what it asks for differs (#306).
        packPurchasePending = true;
        startStatusPolling();
        render();
        try {
          await window.openai.openExternal({ href: purchaseUrl });
        } catch {
          // Nothing to do: the link is already on screen.
        }
      }

      // Attach click handler
      document
        .getElementById("send-button")
        .addEventListener("click", handleSend);
      document
        .getElementById("pay-send-button")
        .addEventListener("click", handlePayAndSend);
      document
        .getElementById("buy-pack-button")
        .addEventListener("click", handleBuyPack);
      document
        .getElementById("check-status-button")
        .addEventListener("click", () => {
          void refreshPurchaseStatus().then((finished) => {
            if (!finished) scheduleStatusPoll();
          });
        });

      // Coming back from the checkout tab is the moment the answer is wanted,
      // and the first moment a hidden iframe is allowed to run again.
      document.addEventListener("visibilitychange", () => {
        if (!trackedOrderId && !packPurchasePending) return;
        if (document.hidden) {
          stopStatusPolling();
          return;
        }
        void refreshPurchaseStatus().then((finished) => {
          if (!finished) scheduleStatusPoll();
        });
      });

      // Initial render (will show loading state)
      render();

      // Listen for data updates (per OpenAI docs)
      window.addEventListener("openai:set_globals", () => {
        render();
      });
    </script>
  </body>
</html>
