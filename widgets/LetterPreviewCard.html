<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterPreviewCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-success: #065f46;
        --accent-success-bg: #d1fae5;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --accent-primary: #2563eb;
        --accent-primary-hover: #1d4ed8;
        --accent-primary-disabled: #93c5fd;
        --letter-bg: #fffef8;
        --address-window-bg: #f0f0f0;

        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-success: #34d399;
        --accent-success-bg: #064e3b;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
        --accent-primary-disabled: #1e3a5f;
        --letter-bg: #2d3748;
        --address-window-bg: #374151;
      }

      /* Dark mode scrollbar styling */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .dark ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: 4px;
      }

      .dark ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* Firefox scrollbar support */
      .dark * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-color) var(--bg-secondary);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      /* Letter Mockup - Visual representation of letter */
      .letter-mockup-container {
        padding: 1rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: center;
      }

      .letter-mockup {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 8.5 / 11;
        background: var(--letter-bg);
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* Address window area (top portion) - mimics PostGrid layout */
      .address-window {
        height: 30%;
        background: var(--address-window-bg);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 0.4rem;
        border-bottom: 1px dashed var(--border-color);
        position: relative;
      }

      .return-address {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 0.45rem;
        line-height: 1.3;
        color: var(--text-primary);
        text-transform: uppercase;
      }

      .recipient-address {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 0.5rem;
        line-height: 1.3;
        color: var(--text-primary);
        text-transform: uppercase;
        margin-left: 0.8rem;
      }

      .address-window-label {
        font-size: 0.65rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: center;
        align-self: center;
        margin: auto;
      }

      /* Letter content area */
      .letter-content {
        flex: 1;
        padding: 0.5rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: "Times New Roman", Georgia, serif;
        font-size: 0.55rem;
        line-height: 1.6; /* Match PostGrid line-height */
        color: var(--text-primary);
      }

      /* Header image layout */
      .header-image-wrapper {
        width: 100%;
        max-height: 20%;
        margin-bottom: 0.3rem;
        display: flex;
        justify-content: center;
      }

      .header-image-wrapper img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* Body text */
      .body-text {
        overflow: hidden;
        white-space: pre-wrap;
        word-wrap: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 20; /* Show more lines - content is already validated */
        -webkit-box-orient: vertical;
      }

      /* Sign-off */
      .sign-off {
        margin-top: 0.3rem;
        white-space: pre-wrap;
        font-size: 0.5rem;
      }

      /* Inline image layout */
      .inline-image-wrapper {
        width: 100%;
        max-height: 25%;
        margin-top: 0.3rem;
        display: flex;
        justify-content: center;
      }

      .inline-image-wrapper img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* Layout badge */
      .layout-badge {
        position: absolute;
        top: 0.3rem;
        right: 0.3rem;
        font-size: 0.5rem;
        padding: 0.15rem 0.3rem;
        background: var(--accent-primary);
        color: white;
        border-radius: 3px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .layout-badge.text-only {
        background: #6b7280;
      }

      .layout-badge.header-image {
        background: #8b5cf6;
      }

      .layout-badge.inline-image {
        background: #10b981;
      }

      /* Meta section */
      .meta {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
      }

      .info-label {
        color: var(--text-secondary);
      }

      .info-value {
        font-weight: 600;
        color: var(--text-primary);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .status-pill.ok {
        background: var(--accent-success-bg);
        color: var(--accent-success);
      }

      .status-pill.alert {
        background: var(--accent-warning-bg);
        color: var(--accent-warning);
      }

      .note {
        font-size: 0.85rem;
        color: var(--text-secondary);
        padding: 0.75rem;
        background: var(--bg-secondary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      /* Send button styles */
      .send-button {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        background: var(--accent-primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .send-button:hover:not(:disabled) {
        background: var(--accent-primary-hover);
      }

      .send-button:disabled {
        background: var(--accent-primary-disabled);
        cursor: not-allowed;
        opacity: 0.7;
      }

      .send-button.loading {
        pointer-events: none;
      }

      .send-button .spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .purchase-actions {
        display: grid;
        gap: 0.6rem;
      }

      .send-button.secondary {
        color: var(--accent-primary);
        background: transparent;
        border: 1px solid var(--accent-primary);
      }

      .send-button.secondary:hover:not(:disabled) {
        background: var(--bg-secondary);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Success/Error states */
      .send-result {
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.9rem;
        text-align: center;
      }

      .send-result.success {
        background: var(--accent-success-bg);
        color: var(--accent-success);
      }

      .send-result.error {
        background: var(--accent-warning-bg);
        color: var(--accent-warning);
      }

      /* Loading state */
      .loading .info-value,
      .loading .status-pill {
        background: linear-gradient(
          90deg,
          var(--bg-secondary) 25%,
          var(--border-color) 50%,
          var(--bg-secondary) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        color: transparent;
        border-radius: 4px;
        min-width: 60px;
      }

      .loading .status-pill {
        min-width: 100px;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .preview-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        color: var(--text-secondary);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="letter-mockup-container" id="mockup-container">
        <div class="preview-loading">Loading letter preview...</div>
      </div>
      <div class="meta">
        <div class="info-row">
          <span class="info-label">Layout</span>
          <span class="info-value" id="layout-type">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Cost</span>
          <span class="info-value" id="cost">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Delivery</span>
          <span class="info-value" id="delivery">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="status-pill" id="status-pill">Loading...</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="id-label">Draft</span>
          <span class="info-value" id="id-value">—</span>
        </div>
        <div class="note" id="note" style="display: none"></div>
        <!-- Send button - US-MCP-08 -->
        <button class="send-button" id="send-button" disabled>
          <span id="send-button-text">Send Letter</span>
        </button>
        <div
          class="purchase-actions"
          id="purchase-actions"
          style="display: none"
        >
          <button class="send-button" id="pay-send-button">
            <span id="pay-send-button-text">Pay &amp; Send</span>
          </button>
          <button class="send-button secondary" id="buy-pack-button">
            Buy a Letter Pack
          </button>
        </div>
        <div
          id="error-message"
          class="send-result error"
          style="display: none"
        ></div>
      </div>
    </div>

    <script type="module">
      // Per OpenAI docs, data may not be available immediately
      // Must listen for 'openai:set_globals' event
      //
      // US-LAYOUT-05: Visual letter mockup with layout-aware rendering
      // US-MCP-08: Send button calls send_letter via callTool

      let dataLoaded = false;
      let currentDraftId = null;
      let currentEligibility = null;
      let sendInProgress = false;
      let checkoutInProgress = false;

      function escapeHtml(text) {
        if (!text) return "";
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function truncateText(text, maxLength) {
        if (!text || text.length <= maxLength) return text;
        return text.substring(0, maxLength) + "...";
      }

      function getLayoutBadgeClass(layoutType) {
        switch (layoutType) {
          case "header_image":
            return "header-image";
          case "inline_image":
            return "inline-image";
          default:
            return "text-only";
        }
      }

      function getLayoutLabel(layoutType) {
        switch (layoutType) {
          case "header_image":
            return "Header";
          case "inline_image":
            return "Inline";
          default:
            return "Text";
        }
      }

      function formatAddress(addr) {
        if (!addr) return null;
        const lines = [];
        if (addr.name) lines.push(addr.name);
        if (addr.addressLine1) lines.push(addr.addressLine1);
        if (addr.addressLine2) lines.push(addr.addressLine2);
        const cityLine = [addr.city, addr.state, addr.postalCode]
          .filter(Boolean)
          .join(", ")
          .replace(", ", ", ")
          .replace(/,([^,]*)$/, " $1");
        if (cityLine) lines.push(cityLine);
        return lines.join("<br>");
      }

      function renderLetterMockup(state) {
        const container = document.getElementById("mockup-container");
        const layoutType = state.layoutType || "text_only";

        // Get addresses from validation objects (already in output)
        const senderAddr = state.senderAddressValidation?.originalAddress;
        const recipientAddr = state.recipientAddressValidation?.originalAddress;

        // Get content from previewHtml fallback or direct fields
        let bodyText = "";
        let signOff = "";

        // Attempt to parse from previewHtml if direct fields not available
        const previewHtml =
          window.openai?.toolResponseMetadata?.previewHtml ?? state.previewHtml;
        if (previewHtml) {
          // Try to extract body
          const bodyMatch = previewHtml.match(
            /<div class="letter-body">([\s\S]*?)<\/div>/,
          );
          if (bodyMatch) {
            bodyText = bodyMatch[1].replace(/<[^>]+>/g, "").trim();
          }

          // Try to extract sign-off
          const signOffMatch = previewHtml.match(
            /<div class="sign-off">([\s\S]*?)<\/div>/,
          );
          if (signOffMatch) {
            signOff = signOffMatch[1].replace(/<[^>]+>/g, "").trim();
          }
        }

        // Fallback to raw body text display
        if (!bodyText && !signOff) {
          bodyText = "Letter preview";
        }

        // Build address window content
        const senderHtml = senderAddr ? formatAddress(senderAddr) : "";
        const recipientHtml = recipientAddr ? formatAddress(recipientAddr) : "";
        const hasAddresses = senderHtml || recipientHtml;

        // Build the mockup HTML
        let mockupHtml = `
          <div class="letter-mockup">
            <div class="layout-badge ${getLayoutBadgeClass(layoutType)}">${getLayoutLabel(layoutType)}</div>
            <div class="address-window">
              ${
                hasAddresses
                  ? `
                ${senderHtml ? `<div class="return-address">${senderHtml}</div>` : ""}
                ${recipientHtml ? `<div class="recipient-address">${recipientHtml}</div>` : ""}
              `
                  : `<span class="address-window-label">Address Window</span>`
              }
            </div>
            <div class="letter-content">
        `;

        // Header image (if applicable)
        // Prefer the small preview image (headerImagePreview) for faster widget loading
        // Fall back to full-quality headerImageData if preview not available
        const headerImage = state.headerImagePreview || state.headerImageData;
        if (layoutType === "header_image" && headerImage) {
          mockupHtml += `
            <div class="header-image-wrapper">
              <img src="${headerImage}" alt="Header">
            </div>
          `;
        }

        // Body text - show full content (already validated by character limits)
        mockupHtml += `<div class="body-text">${escapeHtml(bodyText)}</div>`;

        // Sign-off
        if (signOff) {
          mockupHtml += `<div class="sign-off">${escapeHtml(truncateText(signOff, 50))}</div>`;
        }

        // Inline image (if applicable)
        // Prefer the small preview image (inlineImagePreview) for faster widget loading
        // Fall back to full-quality inlineImageData if preview not available
        const inlineImage = state.inlineImagePreview || state.inlineImageData;
        if (layoutType === "inline_image" && inlineImage) {
          mockupHtml += `
            <div class="inline-image-wrapper">
              <img src="${inlineImage}" alt="Photo">
            </div>
          `;
        }

        mockupHtml += `
            </div>
          </div>
        `;

        container.innerHTML = mockupHtml;
      }

      function showLoading() {
        const card = document.getElementById("card");
        card.classList.add("loading");

        // Show loading state
        document.getElementById("mockup-container").innerHTML =
          '<div class="preview-loading">Loading letter preview...</div>';
        document.getElementById("layout-type").textContent = "—";
        document.getElementById("cost").textContent = "—";
        document.getElementById("delivery").textContent = "—";

        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        statusPill.textContent = "Loading...";

        document.getElementById("note").style.display = "none";

        // Disable send button during loading
        const sendButton = document.getElementById("send-button");
        sendButton.disabled = true;
      }

      function render() {
        const state = window.openai?.toolOutput;

        // Check if we have actual data
        if (!state || state.draftId === undefined) {
          if (!dataLoaded) {
            showLoading();
          }
          return;
        }

        dataLoaded = true;
        const card = document.getElementById("card");
        card.classList.remove("loading");

        const {
          lettersRequired,
          canSendNow,
          reasonCannotSend,
          sendEligibility,
          deliveryClass,
          estimatedDeliveryDays,
          deliveryEstimate,
          deliveryDisclaimer,
          savedReturnAddressNote,
          draftId,
          layoutType,
        } = state;

        // Store draftId for send button
        currentDraftId = draftId;
        currentEligibility = sendEligibility || null;

        // Render the letter mockup (US-LAYOUT-05)
        renderLetterMockup(state);

        // Layout type
        const layoutLabels = {
          text_only: "Text Only",
          header_image: "Header Image",
          inline_image: "Inline Image",
        };
        document.getElementById("layout-type").textContent =
          layoutLabels[layoutType] || "Text Only";

        // Cost - lettersRequired is already in letters (1 letter = 1 standard letter)
        const letters = lettersRequired ?? 1;
        document.getElementById("cost").textContent =
          `${letters} Letter${letters === 1 ? "" : "s"}`;

        // Delivery info
        const deliveryText = [];
        if (deliveryClass) deliveryText.push(deliveryClass);
        if (deliveryEstimate) {
          deliveryText.push(deliveryEstimate);
        } else if (estimatedDeliveryDays) {
          deliveryText.push(`~${estimatedDeliveryDays} days`);
        }
        if (deliveryDisclaimer) deliveryText.push(deliveryDisclaimer);
        document.getElementById("delivery").textContent =
          deliveryText.length > 0 ? deliveryText.join(" - ") : "Standard";

        // Status pill
        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        if (canSendNow) {
          statusPill.classList.add("ok");
          statusPill.textContent = "Ready to send";
        } else {
          statusPill.classList.add("alert");
          statusPill.textContent = reasonCannotSend ?? "Cannot send";
        }

        // Note about saved return address
        const noteEl = document.getElementById("note");
        if (savedReturnAddressNote) {
          noteEl.textContent = savedReturnAddressNote;
          noteEl.style.display = "block";
        } else {
          noteEl.style.display = "none";
        }

        // Show Draft ID
        document.getElementById("id-label").textContent = "Draft";
        document.getElementById("id-value").textContent = draftId || "—";

        // Update send button state
        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const purchaseActions = document.getElementById("purchase-actions");
        const paySendButton = document.getElementById("pay-send-button");
        const paySendButtonText = document.getElementById(
          "pay-send-button-text",
        );
        const buyPackButton = document.getElementById("buy-pack-button");

        if (!sendInProgress && !checkoutInProgress) {
          sendButton.style.display = canSendNow ? "flex" : "none";
          sendButton.disabled = !canSendNow;
          sendButtonText.textContent = "Send Letter";

          const payAndSend = sendEligibility?.payAndSend;
          const letterPack = sendEligibility?.letterPack;
          purchaseActions.style.display = canSendNow ? "none" : "grid";
          paySendButton.style.display = payAndSend?.available ? "flex" : "none";
          paySendButton.disabled = !payAndSend?.available;
          if (payAndSend?.available && payAndSend.amountCents) {
            const amount = (payAndSend.amountCents / 100).toFixed(2);
            paySendButtonText.textContent = `Pay & Send (${String(payAndSend.currency || "usd").toUpperCase()} ${amount})`;
          }
          buyPackButton.style.display = letterPack?.available ? "flex" : "none";
        }
      }

      // Handle send button click - US-MCP-08
      async function handleSend() {
        if (sendInProgress || !currentDraftId) return;

        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const statusPill = document.getElementById("status-pill");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        const errorMessage = document.getElementById("error-message");

        // Hide any previous error
        errorMessage.style.display = "none";

        // Show loading state
        sendInProgress = true;
        sendButton.disabled = true;
        sendButton.classList.add("loading");
        sendButtonText.innerHTML = '<span class="spinner"></span> Sending...';

        try {
          // Call send_letter via OpenAI callTool
          const result = await window.openai.callTool("send_letter", {
            draftId: currentDraftId,
            confirm: true,
          });

          // Extract orderId - callTool may return different structures
          const orderId =
            result?.orderId ||
            result?.structuredContent?.orderId ||
            result?.content?.[0]?.text?.match(/Order ID: ([a-f0-9-]+)/i)?.[1] ||
            null;

          // Update status pill to show sent
          statusPill.classList.remove("ok", "alert");
          statusPill.classList.add("ok");
          statusPill.textContent = "Sent!";

          // Change Draft label to Order and show order ID
          idLabel.textContent = "Order";
          idValue.textContent = orderId || "Confirmed";

          // Update button to show success
          sendButton.classList.remove("loading");
          sendButtonText.innerHTML = "Letter Sent!";
          // Keep button disabled
        } catch (error) {
          // Show error message
          errorMessage.textContent = `Failed to send: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";

          // Reset button for retry
          sendButton.classList.remove("loading");
          sendButton.disabled = false;
          sendButtonText.textContent = "Retry Send";

          // Update status pill to alert state
          statusPill.classList.remove("ok");
          statusPill.classList.add("alert");
          statusPill.textContent = "Send failed";

          sendInProgress = false;
        }
      }

      function toolData(result) {
        return result?.structuredContent || result || {};
      }

      async function pollPurchaseStatus(orderId) {
        const statusPill = document.getElementById("status-pill");
        for (let attempt = 0; attempt < 12; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, 2500));
          const statusResult = await window.openai.callTool(
            "get_purchase_status",
            { orderId },
          );
          const status = toolData(statusResult);
          if (status.purchaseStatus === "processing") {
            statusPill.classList.remove("alert");
            statusPill.classList.add("ok");
            statusPill.textContent = "Paid - preparing mail";
            return;
          }
          if (status.purchaseStatus === "sent") {
            statusPill.classList.remove("alert");
            statusPill.classList.add("ok");
            statusPill.textContent = "Sent!";
            return;
          }
          if (
            [
              "payment_failed",
              "refund_pending",
              "refunded",
              "cancelled",
            ].includes(status.purchaseStatus)
          ) {
            statusPill.classList.remove("ok");
            statusPill.classList.add("alert");
            statusPill.textContent = status.message || status.purchaseStatus;
            return;
          }
        }
        statusPill.textContent = "Checkout open - status may take a moment";
      }

      async function handlePayAndSend() {
        if (checkoutInProgress || !currentDraftId) return;
        const button = document.getElementById("pay-send-button");
        const buttonText = document.getElementById("pay-send-button-text");
        const errorMessage = document.getElementById("error-message");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        checkoutInProgress = true;
        errorMessage.style.display = "none";
        button.disabled = true;
        button.classList.add("loading");
        buttonText.innerHTML =
          '<span class="spinner"></span> Preparing checkout...';
        try {
          const result = toolData(
            await window.openai.callTool("create_mail_checkout", {
              draftId: currentDraftId,
            }),
          );
          if (!result.checkoutUrl) {
            throw new Error(result.message || "Checkout URL was not returned");
          }
          idLabel.textContent = "Purchase";
          idValue.textContent = result.orderId;
          button.classList.remove("loading");
          buttonText.textContent = "Checkout Opened";
          await window.openai.openExternal({ href: result.checkoutUrl });
          void pollPurchaseStatus(result.orderId).catch(() => undefined);
        } catch (error) {
          errorMessage.textContent = `Unable to open checkout: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";
          button.classList.remove("loading");
          button.disabled = false;
          buttonText.textContent = "Retry Pay & Send";
          checkoutInProgress = false;
        }
      }

      async function handleBuyPack() {
        const purchaseUrl = currentEligibility?.letterPack?.purchaseUrl;
        if (!purchaseUrl) return;
        await window.openai.openExternal({ href: purchaseUrl });
      }

      // Attach click handler
      document
        .getElementById("send-button")
        .addEventListener("click", handleSend);
      document
        .getElementById("pay-send-button")
        .addEventListener("click", handlePayAndSend);
      document
        .getElementById("buy-pack-button")
        .addEventListener("click", handleBuyPack);

      // Apply theme
      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      // Initial render (will show loading state)
      render();

      // Listen for data updates (per OpenAI docs)
      window.addEventListener("openai:set_globals", () => {
        render();
      });
    </script>
  </body>
</html>
