<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenerateImageCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --accent-primary: #2563eb;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --accent-primary: #3b82f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      /* State: Loading */
      .loading-state {
        padding: 2.5rem 1.5rem;
        text-align: center;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* State: Preview */
      .preview-state {
        padding: 1rem;
      }

      .preview-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .preview-image-container img {
        max-width: 100%;
        display: block;
      }

      .preview-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 0.5rem;
      }

      /* URL display */
      .url-display {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        margin-top: 0.75rem;
      }

      .url-display code {
        flex: 1;
        font-size: 0.75rem;
        color: var(--text-secondary);
        word-break: break-all;
        font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      }

      .btn-copy {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font-size: 0.7rem;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-copy:hover {
        background: var(--bg-primary);
      }

      /* State: Error */
      .error-state {
        padding: 1.5rem;
        text-align: center;
      }

      .error-message {
        font-size: 0.85rem;
        color: var(--accent-warning);
        background: var(--accent-warning-bg);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin: 0;
      }

      /* Utility */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Loading State -->
      <div id="state-loading" class="loading-state">
        <div class="spinner"></div>
        <p class="loading-text">Generating your image...</p>
      </div>

      <!-- Preview State -->
      <div id="state-preview" class="preview-state hidden">
        <p class="preview-label">AI-Generated Image</p>
        <div class="preview-image-container">
          <img id="preview-img" src="" alt="Generated image preview" />
        </div>
        <div id="url-display" class="url-display hidden">
          <code id="url-text"></code>
          <button class="btn-copy" id="btn-copy" type="button">Copy</button>
        </div>
      </div>

      <!-- Error State -->
      <div id="state-error" class="error-state hidden">
        <p id="error-message" class="error-message"></p>
      </div>
    </div>

    <script type="module">
      let dataLoaded = false;
      let imageUrl = null;
      let notificationResult = null;

      const stateLoading = document.getElementById("state-loading");
      const statePreview = document.getElementById("state-preview");
      const stateError = document.getElementById("state-error");
      const previewImg = document.getElementById("preview-img");
      const errorMessageEl = document.getElementById("error-message");
      const urlDisplay = document.getElementById("url-display");
      const urlText = document.getElementById("url-text");
      const btnCopy = document.getElementById("btn-copy");

      function showState(state) {
        stateLoading.classList.toggle("hidden", state !== "loading");
        statePreview.classList.toggle("hidden", state !== "preview");
        stateError.classList.toggle("hidden", state !== "error");
      }

      function showError(msg) {
        errorMessageEl.textContent = msg;
        showState("error");
      }

      function isRecord(value) {
        return value !== null && typeof value === "object";
      }

      function nonEmptyString(value) {
        return typeof value === "string" && value.trim() ? value : null;
      }

      function unwrapToolResult(value) {
        if (!isRecord(value)) return null;
        if (isRecord(value.mcp_tool_result)) return unwrapToolResult(value.mcp_tool_result);
        if (isRecord(value.call_tool_result)) return unwrapToolResult(value.call_tool_result);
        if (isRecord(value.result)) return unwrapToolResult(value.result);
        return value;
      }

      function resolveWidgetData() {
        const responseMetadata = window.openai?.toolResponseMetadata;
        const metadataResult = unwrapToolResult(responseMetadata);
        const notifiedResult = unwrapToolResult(notificationResult);
        const output = window.openai?.toolOutput
          ?? metadataResult?.structuredContent
          ?? notifiedResult?.structuredContent
          ?? null;
        const hiddenMeta = metadataResult?._meta
          ?? notifiedResult?._meta
          ?? (isRecord(responseMetadata) ? responseMetadata : null);

        return {
          output,
          previewData: nonEmptyString(hiddenMeta?.generatedImagePreview),
          generatedImageUrl: nonEmptyString(output?.generatedImageUrl)
            ?? nonEmptyString(hiddenMeta?.generatedImageUrl),
          resultArrived: Boolean(output || responseMetadata || notificationResult)
        };
      }

      function render() {
        const { output, previewData, generatedImageUrl, resultArrived } = resolveWidgetData();
        imageUrl = generatedImageUrl;

        if (previewData) {
          dataLoaded = true;
          previewImg.src = "data:image/jpeg;base64," + previewData;
          if (imageUrl) {
            urlText.textContent = imageUrl;
            urlDisplay.classList.remove("hidden");
          }
          showState("preview");
          return;
        }

        if (imageUrl) {
          dataLoaded = true;
          previewImg.src = imageUrl;
          previewImg.onerror = () => showError("Could not load image preview.");
          urlText.textContent = imageUrl;
          urlDisplay.classList.remove("hidden");
          showState("preview");
          return;
        }

        if (!dataLoaded && !resultArrived) return;

        dataLoaded = true;
        showError(output?.error || "No image was generated. Please try again.");
      }

      btnCopy.addEventListener("click", () => {
        if (!imageUrl) return;
        navigator.clipboard.writeText(imageUrl).then(() => {
          btnCopy.textContent = "Copied!";
          setTimeout(() => { btnCopy.textContent = "Copy"; }, 2000);
        });
      });

      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      showState("loading");
      render();

      window.addEventListener("openai:set_globals", () => {
        render();
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!isRecord(message) || message.jsonrpc !== "2.0") return;
        if (message.method !== "ui/notifications/tool-result") return;
        notificationResult = message.params;
        render();
      });
    </script>
  </body>
</html>
