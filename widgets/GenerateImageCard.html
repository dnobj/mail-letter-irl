<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenerateImageCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-success: #065f46;
        --accent-success-bg: #d1fae5;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --accent-primary: #2563eb;
        --accent-primary-hover: #1d4ed8;
        --accent-primary-disabled: #93c5fd;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-success: #34d399;
        --accent-success-bg: #064e3b;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
        --accent-primary-disabled: #1e3a5f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      /* State: Loading */
      .loading-state {
        padding: 2.5rem 1.5rem;
        text-align: center;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* State: Preview */
      .preview-state {
        padding: 1rem;
      }

      .preview-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        margin-bottom: 0.75rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .preview-image-container img {
        max-width: 100%;
        display: block;
      }

      .preview-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 0.5rem;
      }

      .preview-actions {
        display: flex;
        gap: 0.5rem;
      }

      .preview-actions .btn {
        flex: 1;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s ease;
      }

      .btn-primary {
        background: var(--accent-primary);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-primary-hover);
      }

      .btn-secondary {
        background: transparent;
        color: var(--accent-primary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: var(--bg-secondary);
      }

      /* State: Success */
      .success-state {
        padding: 1.5rem;
        text-align: center;
      }

      .success-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      .success-text {
        font-size: 0.9rem;
        color: var(--accent-success);
        margin: 0;
        font-weight: 600;
      }

      /* State: Error */
      .error-state {
        padding: 1.5rem;
        text-align: center;
      }

      .error-message {
        font-size: 0.85rem;
        color: var(--accent-warning);
        background: var(--accent-warning-bg);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin: 0 0 1rem;
      }

      /* Utility */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Loading State -->
      <div id="state-loading" class="loading-state">
        <div class="spinner"></div>
        <p class="loading-text">Generating your image...</p>
      </div>

      <!-- Preview State -->
      <div id="state-preview" class="preview-state hidden">
        <p class="preview-label">AI-Generated Image</p>
        <div class="preview-image-container">
          <img id="preview-img" src="" alt="Generated image preview" />
        </div>
        <div class="preview-actions">
          <button class="btn btn-secondary" id="btn-another" type="button">Generate Another</button>
          <button class="btn btn-primary" id="btn-use" type="button">Use This Image</button>
        </div>
      </div>

      <!-- Success State -->
      <div id="state-success" class="success-state hidden">
        <div class="success-icon">&#x2705;</div>
        <p class="success-text">Image ready! ChatGPT will use it next.</p>
      </div>

      <!-- Error State -->
      <div id="state-error" class="error-state hidden">
        <p id="error-message" class="error-message"></p>
        <button class="btn btn-primary" id="btn-retry" type="button">Try Again</button>
      </div>
    </div>

    <script type="module">
      // Per OpenAI docs, widget data may not be available immediately.
      // Must listen for 'openai:set_globals' event to know when data is ready.
      // This pattern matches the working LetterPreviewCard widget.

      let dataLoaded = false;
      let imageUrl = null;

      // --- DOM refs ---
      const stateLoading = document.getElementById("state-loading");
      const statePreview = document.getElementById("state-preview");
      const stateSuccess = document.getElementById("state-success");
      const stateError = document.getElementById("state-error");

      const btnUse = document.getElementById("btn-use");
      const btnAnother = document.getElementById("btn-another");
      const btnRetry = document.getElementById("btn-retry");
      const previewImg = document.getElementById("preview-img");
      const errorMessageEl = document.getElementById("error-message");

      // --- State management ---
      function showState(state) {
        stateLoading.classList.toggle("hidden", state !== "loading");
        statePreview.classList.toggle("hidden", state !== "preview");
        stateSuccess.classList.toggle("hidden", state !== "success");
        stateError.classList.toggle("hidden", state !== "error");
      }

      function showError(msg) {
        errorMessageEl.textContent = msg;
        showState("error");
      }

      // --- Render from tool output ---
      function render() {
        const output = window.openai?.toolOutput;
        const meta = window.openai?.toolResponseMetadata;

        // Try to get image URL from both sources
        imageUrl = output?.generatedImageUrl ?? meta?.generatedImageUrl ?? null;

        // Try to get preview base64 from both sources
        const previewData = meta?.generatedImagePreview ?? output?.generatedImagePreview;

        // Strategy 1: Use base64 preview data
        if (previewData) {
          dataLoaded = true;
          previewImg.src = "data:image/jpeg;base64," + previewData;
          showState("preview");
          return;
        }

        // Strategy 2: Load image directly from server URL
        if (imageUrl) {
          dataLoaded = true;
          previewImg.src = imageUrl;
          previewImg.onerror = () => {
            showError("Could not load image preview from server.");
          };
          showState("preview");
          return;
        }

        // If neither output nor meta is available yet, stay in loading state
        if (!dataLoaded && !output && !meta) {
          return;
        }

        // Data arrived but no image — show error
        dataLoaded = true;
        if (output?.error) {
          showError(output.error);
        } else {
          showError("No image was generated. Please try again.");
        }
      }

      // --- Event handlers ---
      btnUse.addEventListener("click", () => {
        if (!imageUrl) {
          showError("No image URL available.");
          return;
        }

        showState("success");

        // Post the server-hosted image URL back to ChatGPT
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method: "ui/message",
            params: {
              role: "user",
              content: [
                {
                  type: "text",
                  text: "Generated image ready. Image URL: " + imageUrl
                }
              ]
            }
          },
          "*"
        );
      });

      btnAnother.addEventListener("click", () => {
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method: "ui/message",
            params: {
              role: "user",
              content: [
                {
                  type: "text",
                  text: "Please generate a different image with a new variation."
                }
              ]
            }
          },
          "*"
        );
      });

      btnRetry.addEventListener("click", () => {
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method: "ui/message",
            params: {
              role: "user",
              content: [
                {
                  type: "text",
                  text: "Please try generating the image again."
                }
              ]
            }
          },
          "*"
        );
      });

      // --- Theme ---
      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      // --- Initialize ---
      // Start in loading state, then try to render
      showState("loading");
      render();

      // Listen for data updates (per OpenAI docs)
      window.addEventListener("openai:set_globals", () => {
        render();
      });
    </script>
  </body>
</html>
