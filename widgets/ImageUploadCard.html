<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ImageUploadCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --accent-primary: #2563eb;
        --accent-primary-hover: #1d4ed8;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      /* State: Select */
      .select-state {
        padding: 1.5rem;
        text-align: center;
      }

      .select-icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      .select-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
        color: var(--text-primary);
      }

      .select-guidance {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0 0 1rem;
      }

      .select-formats {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin: 0.75rem 0 0;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s ease;
      }

      .btn-primary {
        background: var(--accent-primary);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-primary-hover);
      }

      .btn-secondary {
        background: transparent;
        color: var(--accent-primary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: var(--bg-secondary);
      }

      /* State: Preview (before upload) */
      .preview-state {
        padding: 1rem;
      }

      .preview-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        margin-bottom: 0.75rem;
        display: flex;
        justify-content: center;
        align-items: center;
        max-height: 250px;
      }

      .preview-image-container img {
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        display: block;
      }

      .preview-file-info {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 0.75rem;
      }

      .preview-actions {
        display: flex;
        gap: 0.5rem;
      }

      .preview-actions .btn {
        flex: 1;
      }

      /* State: Uploading */
      .uploading-state {
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .uploading-text {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* State: Done (after upload) */
      .done-state {
        padding: 1rem;
      }

      .done-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 0.5rem;
      }

      .done-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: center;
        align-items: center;
        max-height: 250px;
      }

      .done-image-container img {
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        display: block;
      }

      /* URL display */
      .url-display {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        margin-top: 0.75rem;
      }

      .url-display code {
        flex: 1;
        font-size: 0.75rem;
        color: var(--text-secondary);
        word-break: break-all;
        font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      }

      .btn-copy {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font-size: 0.7rem;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-copy:hover {
        background: var(--bg-primary);
      }

      /* State: Error */
      .error-state {
        padding: 1.5rem;
        text-align: center;
      }

      .error-message {
        font-size: 0.85rem;
        color: var(--accent-warning);
        background: var(--accent-warning-bg);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin: 0;
      }

      /* Utility */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Select State -->
      <div id="state-select" class="select-state">
        <div class="select-icon">&#x1F4F7;</div>
        <p class="select-title">Upload a Photo</p>
        <p id="guidance-text" class="select-guidance">Select a photo to use in your letter or postcard.</p>
        <button class="btn btn-primary" id="btn-select" type="button">Select Photo</button>
        <p class="select-formats">JPEG, PNG, or WebP &middot; Max 10 MB</p>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" class="hidden" />
      </div>

      <!-- Preview State (before upload) -->
      <div id="state-preview" class="preview-state hidden">
        <div class="preview-image-container">
          <img id="preview-img" src="" alt="Selected photo preview" />
        </div>
        <p id="file-info" class="preview-file-info"></p>
        <div class="preview-actions">
          <button class="btn btn-secondary" id="btn-change" type="button">Choose Different</button>
          <button class="btn btn-primary" id="btn-use" type="button">Use This Photo</button>
        </div>
      </div>

      <!-- Uploading State -->
      <div id="state-uploading" class="uploading-state hidden">
        <div class="spinner"></div>
        <p class="uploading-text">Uploading...</p>
      </div>

      <!-- Done State (after upload) -->
      <div id="state-done" class="done-state hidden">
        <p class="done-label">Uploaded Photo</p>
        <div class="done-image-container">
          <img id="done-img" src="" alt="Uploaded photo" />
        </div>
        <div class="url-display">
          <code id="url-text"></code>
          <button class="btn-copy" id="btn-copy" type="button">Copy</button>
        </div>
      </div>

      <!-- Error State -->
      <div id="state-error" class="error-state hidden">
        <p id="error-message" class="error-message"></p>
      </div>
    </div>

    <script>
      (function () {
        // --- Theme ---
        var theme = (window.openai && window.openai.theme) ? window.openai.theme : "light";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }

        // --- DOM refs ---
        var stateSelect = document.getElementById("state-select");
        var statePreview = document.getElementById("state-preview");
        var stateUploading = document.getElementById("state-uploading");
        var stateDone = document.getElementById("state-done");
        var stateError = document.getElementById("state-error");

        var btnSelect = document.getElementById("btn-select");
        var btnChange = document.getElementById("btn-change");
        var btnUse = document.getElementById("btn-use");
        var btnCopy = document.getElementById("btn-copy");
        var fileInput = document.getElementById("file-input");
        var previewImg = document.getElementById("preview-img");
        var doneImg = document.getElementById("done-img");
        var fileInfo = document.getElementById("file-info");
        var guidanceText = document.getElementById("guidance-text");
        var errorMessage = document.getElementById("error-message");
        var urlText = document.getElementById("url-text");

        var selectedFile = null;
        var previewDataUrl = null;

        var MAX_SIZE_BYTES = 10 * 1024 * 1024;
        var ACCEPTED_TYPES = ["image/png", "image/jpeg", "image/webp"];

        // --- Read context from tool output ---
        var uploadContext = "";
        try {
          if (window.openai && window.openai.toolOutput) {
            var output = window.openai.toolOutput;
            if (output.context) {
              uploadContext = output.context;
            }
            if (output.message) {
              guidanceText.textContent = output.message;
            }
          }
        } catch (e) { /* ignore */ }

        // --- State management ---
        function showState(state) {
          stateSelect.classList.toggle("hidden", state !== "select");
          statePreview.classList.toggle("hidden", state !== "preview");
          stateUploading.classList.toggle("hidden", state !== "uploading");
          stateDone.classList.toggle("hidden", state !== "done");
          stateError.classList.toggle("hidden", state !== "error");
        }

        function showError(msg) {
          errorMessage.textContent = msg;
          showState("error");
        }

        // --- File validation ---
        function validateFile(file) {
          if (!file) return "No file selected.";
          if (ACCEPTED_TYPES.indexOf(file.type) === -1) {
            return "Unsupported format. Please select a JPEG, PNG, or WebP image.";
          }
          if (file.size > MAX_SIZE_BYTES) {
            var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            return "File is too large (" + sizeMB + " MB). Maximum size is 10 MB.";
          }
          return null;
        }

        function formatFileSize(bytes) {
          if (bytes < 1024) return bytes + " B";
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
          return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        // --- File selection (uses FileReader data URL to avoid blob CSP issues in sandbox) ---
        function onFileSelected(file) {
          var error = validateFile(file);
          if (error) {
            showError(error);
            return;
          }

          selectedFile = file;

          var reader = new FileReader();
          reader.onload = function (e) {
            previewDataUrl = e.target.result;
            previewImg.src = previewDataUrl;
            fileInfo.textContent = file.name + " \u00B7 " + formatFileSize(file.size);
            showState("preview");
          };
          reader.onerror = function () {
            showError("Could not read the selected file.");
          };
          reader.readAsDataURL(file);
        }

        // --- Upload via OpenAI SDK ---
        async function uploadAndSend() {
          if (!selectedFile) {
            showError("No file selected.");
            return;
          }

          showState("uploading");

          try {
            var uploadResult = await window.openai.uploadFile(selectedFile);
            var fileId = uploadResult.fileId || uploadResult.file_id;

            if (!fileId) {
              showError("Upload failed — no file ID returned.");
              return;
            }

            var urlResult = await window.openai.getFileDownloadUrl({ fileId: fileId });
            var downloadUrl = urlResult.downloadUrl || urlResult.download_url;

            if (!downloadUrl) {
              showError("Upload succeeded but could not get download URL.");
              return;
            }

            // Show done state with image preview + URL
            doneImg.src = previewDataUrl || "";
            urlText.textContent = downloadUrl;
            showState("done");

            // Call confirm_uploaded_image tool via callTool to put the URL
            // into a server-side tool response that ChatGPT can see and act on.
            // This is more reliable than sendFollowUpMessage which has known issues.
            if (window.openai && window.openai.callTool) {
              await window.openai.callTool("confirm_uploaded_image", {
                imageUrl: downloadUrl,
                context: uploadContext || undefined
              });
            }
          } catch (err) {
            var errMsg = (err && err.message) || "Upload failed. Please try again.";
            showError(errMsg);
          }
        }

        // --- Event handlers ---
        btnSelect.addEventListener("click", function () {
          fileInput.click();
        });

        fileInput.addEventListener("change", function () {
          if (fileInput.files && fileInput.files[0]) {
            onFileSelected(fileInput.files[0]);
          }
        });

        btnChange.addEventListener("click", function () {
          fileInput.value = "";
          selectedFile = null;
          previewDataUrl = null;
          showState("select");
          fileInput.click();
        });

        btnUse.addEventListener("click", function () {
          uploadAndSend();
        });

        btnCopy.addEventListener("click", function () {
          var url = urlText.textContent;
          if (!url) return;
          navigator.clipboard.writeText(url).then(function () {
            btnCopy.textContent = "Copied!";
            setTimeout(function () { btnCopy.textContent = "Copy"; }, 2000);
          });
        });

        // --- Initialize ---
        showState("select");
      })();
    </script>
  </body>
</html>
