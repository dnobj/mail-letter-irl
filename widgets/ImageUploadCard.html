<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ImageUploadCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #1f2933;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --accent-primary: #2563eb;
        --accent-primary-hover: #1d4ed8;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      /* State: Select */
      .select-state {
        padding: 1.5rem;
        text-align: center;
      }

      .select-icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      .select-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
        color: var(--text-primary);
      }

      .select-guidance {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0 0 1rem;
      }

      .select-formats {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin: 0.75rem 0 0;
      }

      .select-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s ease;
      }

      .btn-primary {
        background: var(--accent-primary);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-primary-hover);
      }

      .btn-secondary {
        background: transparent;
        color: var(--accent-primary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: var(--bg-secondary);
      }

      .btn[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      /* State: Preview (before upload) */
      .preview-state {
        padding: 1rem;
      }

      .preview-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        margin-bottom: 0.75rem;
        display: flex;
        justify-content: center;
        align-items: center;
        max-height: 250px;
      }

      .preview-image-container img {
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        display: block;
      }

      .preview-file-info {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 0.75rem;
      }

      .preview-actions {
        display: flex;
        gap: 0.5rem;
      }

      .preview-actions .btn {
        flex: 1;
      }

      /* State: Uploading */
      .uploading-state {
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .uploading-text {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* State: Done (after upload) */
      .done-state {
        padding: 1rem;
      }

      .done-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 0.5rem;
      }

      .done-image-container {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: center;
        align-items: center;
        max-height: 250px;
      }

      .done-image-container img {
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        display: block;
      }

      /* URL display */
      .url-display {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        margin-top: 0.75rem;
      }

      .url-display code {
        flex: 1;
        font-size: 0.75rem;
        color: var(--text-secondary);
        word-break: break-all;
        font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      }

      .btn-copy {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font-size: 0.7rem;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-copy:hover {
        background: var(--bg-primary);
      }

      /* State: Error */
      .error-state {
        padding: 1.5rem;
        text-align: center;
      }

      .error-message {
        font-size: 0.85rem;
        color: var(--accent-warning);
        background: var(--accent-warning-bg);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin: 0;
      }

      /* Utility */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Select State -->
      <div id="state-select" class="select-state">
        <div class="select-icon">&#x1F4F7;</div>
        <p class="select-title">Upload a Photo</p>
        <p id="guidance-text" class="select-guidance">Select a photo to use in your letter or postcard.</p>
        <div class="select-actions">
          <button class="btn btn-primary" id="btn-select" type="button">Select Photo</button>
          <button class="btn btn-secondary hidden" id="btn-library" type="button">Choose from Library</button>
        </div>
        <p id="library-status" class="select-formats hidden"></p>
        <p class="select-formats">JPEG, PNG, or WebP &middot; Max 10 MB</p>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" class="hidden" />
      </div>

      <!-- Preview State (before upload) -->
      <div id="state-preview" class="preview-state hidden">
        <div class="preview-image-container">
          <img id="preview-img" src="" alt="Selected photo preview" />
        </div>
        <p id="file-info" class="preview-file-info"></p>
        <div class="preview-actions">
          <button class="btn btn-secondary" id="btn-change" type="button">Choose Different</button>
          <button class="btn btn-primary" id="btn-use" type="button">Use This Photo</button>
        </div>
      </div>

      <!-- Uploading State -->
      <div id="state-uploading" class="uploading-state hidden">
        <div class="spinner"></div>
        <p class="uploading-text">Uploading...</p>
      </div>

      <!-- Done State (after upload) -->
      <div id="state-done" class="done-state hidden">
        <p id="done-label" class="done-label">Uploaded Photo</p>
        <div class="done-image-container">
          <img id="done-img" src="" alt="Uploaded photo" />
        </div>
        <div class="url-display">
          <code id="url-text"></code>
          <button class="btn-copy" id="btn-copy" type="button">Copy</button>
        </div>
      </div>

      <!-- Error State -->
      <div id="state-error" class="error-state hidden">
        <p id="error-message" class="error-message"></p>
      </div>
    </div>

    <script>
      (function () {
        // --- Theme ---
        var theme = (window.openai && window.openai.theme) ? window.openai.theme : "light";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }

        // --- DOM refs ---
        var stateSelect = document.getElementById("state-select");
        var statePreview = document.getElementById("state-preview");
        var stateUploading = document.getElementById("state-uploading");
        var stateDone = document.getElementById("state-done");
        var stateError = document.getElementById("state-error");

        var btnSelect = document.getElementById("btn-select");
        var btnLibrary = document.getElementById("btn-library");
        var libraryStatus = document.getElementById("library-status");
        var btnChange = document.getElementById("btn-change");
        var btnUse = document.getElementById("btn-use");
        var btnCopy = document.getElementById("btn-copy");
        var fileInput = document.getElementById("file-input");
        var previewImg = document.getElementById("preview-img");
        var doneImg = document.getElementById("done-img");
        var doneLabel = document.getElementById("done-label");
        var fileInfo = document.getElementById("file-info");
        var guidanceText = document.getElementById("guidance-text");
        var errorMessage = document.getElementById("error-message");
        var urlText = document.getElementById("url-text");

        var selectedFile = null;
        var previewDataUrl = null;
        // Set when the pending preview came from the ChatGPT Library picker
        // (window.openai.selectFiles) instead of a local file. The file already
        // lives in ChatGPT's file store, so "Use This Photo" skips uploadFile
        // and goes straight to the confirm/follow-up handoff with its URL.
        var libraryFile = null;
        // Monotonic guard: every user-initiated source action bumps this, and
        // a library pick that resolves late (the picker is user-paced) checks
        // its captured generation before touching state, so a stale resolve
        // can never clobber a newer local selection or in-flight upload.
        var flowGen = 0;
        var debugEnabled = false;
        var debugEndpoint = "";
        var debugSessionId = "upload-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);

        var MAX_SIZE_BYTES = 10 * 1024 * 1024;
        var ACCEPTED_TYPES = ["image/png", "image/jpeg", "image/webp"];

        // --- Read context from tool output ---
        var uploadContext = "";
        function hydrateFromToolOutput() {
          try {
            if (window.openai && window.openai.toolOutput) {
              var output = window.openai.toolOutput;
              if (output.context) {
                uploadContext = output.context;
              }
              if (output.message) {
                guidanceText.textContent = output.message;
              }
              if (output.debugEnabled === true) {
                debugEnabled = true;
              }
              if (typeof output.debugEndpoint === "string" && output.debugEndpoint) {
                debugEndpoint = output.debugEndpoint;
              }
            }
          } catch (e) { /* ignore */ }
        }
        hydrateFromToolOutput();

        // --- ChatGPT Library picker availability ---
        // selectFiles is plan/region-gated and typed optional on the host
        // bridge, so the button only appears when the API is actually there.
        // Re-checked on openai:set_globals because bridge globals can arrive
        // after initial load.
        function selectFilesAvailable() {
          return !!(window.openai && typeof window.openai.selectFiles === "function");
        }

        function updateLibraryAvailability() {
          btnLibrary.classList.toggle("hidden", !selectFilesAvailable());
        }

        function showLibraryStatus(msg) {
          libraryStatus.textContent = msg || "";
          libraryStatus.classList.toggle("hidden", !msg);
        }

        function scrubMessage(err) {
          var msg = (err && err.message) || err || "Unknown error";
          // Host error strings can embed signed URLs; keep diagnostics URL-free.
          return String(msg).replace(/(?:https?:\/\/|blob:|data:)\S+/g, "[url]");
        }

        function debugLog(message, data) {
          if (!debugEnabled) return;
          if (data !== undefined) {
            console.log("[ImageUploadCard DEBUG] " + message, data);
            return;
          }
          console.log("[ImageUploadCard DEBUG] " + message);
        }

        function debugBeacon(phase, data) {
          if (!debugEnabled || !debugEndpoint) return;

          var payload = {
            source: "ImageUploadCard",
            phase: phase,
            sessionId: debugSessionId,
            context: uploadContext || null,
            timestamp: new Date().toISOString(),
            data: data || {}
          };
          var body = JSON.stringify(payload);

          try {
            // sendBeacon is more resilient if the iframe is about to unload
            if (navigator.sendBeacon) {
              var beaconOk = navigator.sendBeacon(
                debugEndpoint,
                new Blob([body], { type: "application/json" })
              );
              if (beaconOk) {
                return;
              }
            }
          } catch (e) { /* ignore */ }

          fetch(debugEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            keepalive: true
          }).catch(function () {
            // Never fail widget UX on diagnostics
          });
        }

        function buildFollowUpPrompt(downloadUrl, reason) {
          var nextStep;
          if (uploadContext === "postcard") {
            nextStep = 'call quote_and_preview_postcard with imageUrl "' + downloadUrl + '"';
          } else if (uploadContext === "header_image") {
            nextStep = 'call quote_and_preview_letter_with_header_image with imageUrl "' + downloadUrl + '"';
          } else if (uploadContext === "inline_image") {
            nextStep = 'call quote_and_preview_letter_with_image with imageUrl "' + downloadUrl + '"';
          } else {
            nextStep = 'call a preview tool with imageUrl "' + downloadUrl + '"';
          }
          var lead = reason === "library_pick_complete"
            ? "Image selected from the ChatGPT library."
            : "Image upload completed.";
          return lead + " Please " + nextStep + ".";
        }

        async function sendFollowUpFallback(downloadUrl, reason) {
          if (!(window.openai && window.openai.sendFollowUpMessage)) {
            debugLog("sendFollowUpMessage.unavailable");
            debugBeacon("sendFollowUpMessage.unavailable", { reason: reason });
            return;
          }
          var prompt = buildFollowUpPrompt(downloadUrl, reason);
          debugLog("sendFollowUpMessage.start", { reason: reason });
          debugBeacon("sendFollowUpMessage.start", { reason: reason });
          try {
            await window.openai.sendFollowUpMessage({ prompt: prompt });
            debugLog("sendFollowUpMessage.success");
            debugBeacon("sendFollowUpMessage.success");
          } catch (e) {
            debugLog("sendFollowUpMessage.error", { message: scrubMessage(e) });
            debugBeacon("sendFollowUpMessage.error", { message: scrubMessage(e) });
          }
        }

        // --- State management ---
        function showState(state) {
          stateSelect.classList.toggle("hidden", state !== "select");
          statePreview.classList.toggle("hidden", state !== "preview");
          stateUploading.classList.toggle("hidden", state !== "uploading");
          stateDone.classList.toggle("hidden", state !== "done");
          stateError.classList.toggle("hidden", state !== "error");
        }

        function showError(msg) {
          errorMessage.textContent = msg;
          showState("error");
        }

        // --- File validation ---
        function validateFile(file) {
          if (!file) return "No file selected.";
          if (ACCEPTED_TYPES.indexOf(file.type) === -1) {
            return "Unsupported format. Please select a JPEG, PNG, or WebP image.";
          }
          if (file.size > MAX_SIZE_BYTES) {
            var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            return "File is too large (" + sizeMB + " MB). Maximum size is 10 MB.";
          }
          return null;
        }

        function formatFileSize(bytes) {
          if (bytes < 1024) return bytes + " B";
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
          return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        // --- File selection (uses FileReader data URL to avoid blob CSP issues in sandbox) ---
        function onFileSelected(file) {
          var error = validateFile(file);
          if (error) {
            showError(error);
            return;
          }

          selectedFile = file;

          var reader = new FileReader();
          reader.onload = function (e) {
            previewDataUrl = e.target.result;
            previewImg.onerror = null;
            previewImg.src = previewDataUrl;
            fileInfo.textContent = file.name + " \u00B7 " + formatFileSize(file.size);
            showState("preview");
          };
          reader.onerror = function () {
            showError("Could not read the selected file.");
          };
          reader.readAsDataURL(file);
        }

        // --- Shared handoff tail (local upload + Library pick both land here) ---
        async function finishWithDownloadUrl(downloadUrl, previewSrc, reason) {
          // Show done state with image preview + URL
          doneLabel.textContent = reason === "library_pick_complete" ? "Selected Photo" : "Uploaded Photo";
          doneImg.src = previewSrc || "";
          urlText.textContent = downloadUrl;
          showState("done");

          // callTool stores the URL server-side but does NOT create a new
          // ChatGPT conversation turn. We always need sendFollowUpMessage
          // to prompt ChatGPT to act on the uploaded image.
          if (window.openai && window.openai.callTool) {
            try {
              debugLog("callTool.start", { toolName: "confirm_uploaded_image" });
              debugBeacon("callTool.start", { toolName: "confirm_uploaded_image" });
              await window.openai.callTool("confirm_uploaded_image", {
                imageUrl: downloadUrl,
                context: uploadContext || undefined
              });
              debugLog("callTool.success", { toolName: "confirm_uploaded_image" });
              debugBeacon("callTool.success", { toolName: "confirm_uploaded_image" });
            } catch (callErr) {
              debugLog("callTool.error", { message: scrubMessage(callErr) });
              debugBeacon("callTool.error", { message: scrubMessage(callErr) });
            }
          } else {
            debugLog("callTool.unavailable");
            debugBeacon("callTool.unavailable");
          }

          // Always send a follow-up message so ChatGPT knows the image
          // is ready and has the URL to act on.
          await sendFollowUpFallback(downloadUrl, reason);
        }

        // --- Upload via OpenAI SDK ---
        async function uploadAndSend() {
          // Invalidate-only bump: no generation is captured here. Once the
          // uploading state renders there are no clickable controls left, so
          // nothing can race this flow - the bump exists only to discard a
          // library pick still pending from before this click.
          flowGen++;

          if (libraryFile && libraryFile.fileId) {
            // Library files already live in ChatGPT's store; no upload needed.
            // The pick-time URL is a temporary cache URL and the pick-to-confirm
            // gap is user-paced, so re-resolve a fresh one from the durable
            // fileId now instead of handing off a possibly expired link.
            var libFileId = libraryFile.fileId;
            showState("uploading");
            debugLog("library.use", { fileId: libFileId });
            debugBeacon("library.use", { fileId: libFileId });

            try {
              var freshUrl = null;
              try {
                var freshResult = await window.openai.getFileDownloadUrl({ fileId: libFileId });
                freshUrl = (freshResult && (freshResult.downloadUrl || freshResult.download_url)) || null;
                debugLog("library.refreshDownloadUrl.success", { hasDownloadUrl: !!freshUrl });
                debugBeacon("library.refreshDownloadUrl.success", { hasDownloadUrl: !!freshUrl });
              } catch (refreshErr) {
                debugLog("library.refreshDownloadUrl.error", { message: scrubMessage(refreshErr) });
                debugBeacon("library.refreshDownloadUrl.error", { message: scrubMessage(refreshErr) });
              }

              if (!freshUrl) {
                // Routine failure (temporary URLs age out), so recover to the
                // two-button select state instead of the dead-end error state.
                libraryFile = null;
                showState("select");
                showLibraryStatus("That link expired — please pick the photo again.");
                return;
              }

              await finishWithDownloadUrl(freshUrl, freshUrl, "library_pick_complete");
            } catch (libErr) {
              debugLog("uploadAndSend.error", { message: scrubMessage(libErr) });
              debugBeacon("uploadAndSend.error", { message: scrubMessage(libErr) });
              showError("Something went wrong with that library photo. Please try again.");
            }
            return;
          }

          if (!selectedFile) {
            showError("No file selected.");
            return;
          }

          showState("uploading");

          try {
            debugLog("uploadFile.start", { context: uploadContext || "none" });
            debugBeacon("uploadFile.start", { hasFile: !!selectedFile, fileName: selectedFile && selectedFile.name });
            var uploadResult = await window.openai.uploadFile(selectedFile);
            var fileId = uploadResult.fileId || uploadResult.file_id;
            debugLog("uploadFile.success", { fileId: fileId || null });
            debugBeacon("uploadFile.success", { fileId: fileId || null });

            if (!fileId) {
              debugLog("uploadFile.missingFileId");
              debugBeacon("uploadFile.missingFileId");
              showError("Upload failed — no file ID returned.");
              return;
            }

            debugLog("getFileDownloadUrl.start", { fileId: fileId });
            debugBeacon("getFileDownloadUrl.start", { fileId: fileId });
            var urlResult = await window.openai.getFileDownloadUrl({ fileId: fileId });
            var downloadUrl = urlResult.downloadUrl || urlResult.download_url;
            debugLog("getFileDownloadUrl.success", {
              hasDownloadUrl: !!downloadUrl
            });
            debugBeacon("getFileDownloadUrl.success", { hasDownloadUrl: !!downloadUrl });

            if (!downloadUrl) {
              debugLog("getFileDownloadUrl.missingUrl", { fileId: fileId });
              debugBeacon("getFileDownloadUrl.missingUrl", { fileId: fileId });
              showError("Upload succeeded but could not get download URL.");
              return;
            }

            await finishWithDownloadUrl(downloadUrl, previewDataUrl, "upload_complete");
          } catch (err) {
            debugLog("uploadAndSend.error", { message: scrubMessage(err) });
            debugBeacon("uploadAndSend.error", { message: scrubMessage(err) });
            var errMsg = scrubMessage(err);
            showError(errMsg === "Unknown error" ? "Upload failed. Please try again." : errMsg);
          }
        }

        // --- Pick from the ChatGPT Library (window.openai.selectFiles) ---
        // The decisive #227 experiment: does the Library picker expose
        // ChatGPT-GENERATED images (not just uploads)? Every phase beacons so
        // dev runs leave a server-side trail either way.
        async function pickFromLibrary() {
          if (btnLibrary.disabled) {
            return;
          }
          var gen = ++flowGen;
          btnLibrary.disabled = true;
          showLibraryStatus("Opening your ChatGPT library…");
          debugLog("selectFiles.start");
          debugBeacon("selectFiles.start");

          // Escape hatch: selectFiles is user-paced (someone can browse their
          // library for minutes), so we never time the promise out - but if
          // the host API is broken and never settles, re-enable the button so
          // the user can retry. A retry bumps flowGen, which discards this
          // pick if it ever resolves after all.
          var stuckTimer = setTimeout(function () {
            btnLibrary.disabled = false;
          }, 20000);

          try {
            var files;
            try {
              files = await window.openai.selectFiles();
            } catch (e) {
              debugLog("selectFiles.error", { message: scrubMessage(e) });
              debugBeacon("selectFiles.error", { message: scrubMessage(e) });
              if (gen === flowGen) {
                showLibraryStatus("Library selection failed or was canceled.");
              }
              return;
            }
            if (gen !== flowGen) {
              return;
            }

            if (!files || !files.length) {
              debugLog("selectFiles.empty");
              debugBeacon("selectFiles.empty");
              showLibraryStatus("No file was selected.");
              return;
            }

            var picked = files[0] || {};
            var fileId = picked.fileId || picked.file_id;
            var fileName = picked.fileName || picked.file_name || "Library file";
            var mimeType = picked.mimeType || picked.mime_type || "";
            debugLog("selectFiles.success", { count: files.length, fileId: fileId || null, mimeType: mimeType || null });
            debugBeacon("selectFiles.success", { count: files.length, fileId: fileId || null, mimeType: mimeType || null, fileName: fileName });

            if (!fileId) {
              debugLog("selectFiles.missingFileId");
              debugBeacon("selectFiles.missingFileId");
              showLibraryStatus("The library did not return a usable file ID.");
              return;
            }

            if (mimeType && ACCEPTED_TYPES.indexOf(mimeType) === -1) {
              debugLog("selectFiles.unsupportedType", { mimeType: mimeType });
              debugBeacon("selectFiles.unsupportedType", { mimeType: mimeType });
              showLibraryStatus("Unsupported format (" + mimeType + "). Please pick a JPEG, PNG, or WebP image.");
              return;
            }

            var downloadUrl = null;
            try {
              debugLog("library.getFileDownloadUrl.start", { fileId: fileId });
              debugBeacon("library.getFileDownloadUrl.start", { fileId: fileId });
              var urlResult = await window.openai.getFileDownloadUrl({ fileId: fileId });
              downloadUrl = (urlResult && (urlResult.downloadUrl || urlResult.download_url)) || null;
              debugLog("library.getFileDownloadUrl.success", { hasDownloadUrl: !!downloadUrl });
              debugBeacon("library.getFileDownloadUrl.success", { hasDownloadUrl: !!downloadUrl });
            } catch (e) {
              debugLog("library.getFileDownloadUrl.error", { message: scrubMessage(e) });
              debugBeacon("library.getFileDownloadUrl.error", { message: scrubMessage(e) });
            }
            if (gen !== flowGen) {
              return;
            }

            if (!downloadUrl) {
              showLibraryStatus("Could not get a download link for that library file.");
              return;
            }

            selectedFile = null;
            previewDataUrl = null;
            // Deliberately no downloadUrl here: the confirm path re-resolves a
            // fresh one from the durable fileId, and keeping the pick-time URL
            // around would be a trap for a future edit to hand it off stale.
            libraryFile = { fileId: fileId, fileName: fileName, mimeType: mimeType };

            var pickedNote = files.length > 1 ? " · using the first of " + files.length + " selected" : "";
            var baseInfo = fileName + (mimeType ? " · " + mimeType : "") + " · from your ChatGPT library" + pickedNote;
            previewImg.onerror = function () {
              debugLog("library.previewImage.error");
              debugBeacon("library.previewImage.error");
              fileInfo.textContent = baseInfo + " · preview could not be displayed; you can still try this photo, or choose a different one.";
            };
            previewImg.src = downloadUrl;
            fileInfo.textContent = baseInfo;
            showLibraryStatus("");
            showState("preview");
          } finally {
            clearTimeout(stuckTimer);
            btnLibrary.disabled = false;
          }
        }

        // --- Event handlers ---
        btnSelect.addEventListener("click", function () {
          showLibraryStatus("");
          fileInput.click();
        });

        btnLibrary.addEventListener("click", function () {
          pickFromLibrary();
        });

        fileInput.addEventListener("change", function () {
          if (fileInput.files && fileInput.files[0]) {
            flowGen++;
            libraryFile = null;
            showLibraryStatus("");
            onFileSelected(fileInput.files[0]);
          }
        });

        btnChange.addEventListener("click", function () {
          // A library pick returns to the two-button select state; only the
          // local-file path re-opens the file dialog straight away.
          var fromLibrary = !!libraryFile;
          flowGen++;
          fileInput.value = "";
          selectedFile = null;
          previewDataUrl = null;
          libraryFile = null;
          showLibraryStatus("");
          showState("select");
          if (!fromLibrary) {
            fileInput.click();
          }
        });

        btnUse.addEventListener("click", function () {
          uploadAndSend();
        });

        btnCopy.addEventListener("click", function () {
          var url = urlText.textContent;
          if (!url) return;
          navigator.clipboard.writeText(url).then(function () {
            btnCopy.textContent = "Copied!";
            setTimeout(function () { btnCopy.textContent = "Copy"; }, 2000);
          });
        });

        // --- Initialize ---
        showState("select");
        updateLibraryAvailability();
        window.addEventListener("openai:set_globals", function () {
          hydrateFromToolOutput();
          updateLibraryAvailability();
        });
      })();
    </script>
  </body>
</html>
