      .hd span.ctx{margin-left:auto;font-size:11.5px;color:var(--mut)}

      .title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:600;color:var(--tx);letter-spacing:-.01em}
      .ov{font-size:13px;line-height:1.55;color:var(--tb);margin:7px 0 0}
      .paper{background:#fdfcf8;border:1px solid #e6e0d2;border-radius:10px;padding:11px 13px;margin-top:10px}
      .plabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9f4f2b;margin:0 0 5px}
      .ptext{font-size:12.5px;line-height:1.55;color:#4a4036;margin:0}
      .paper ul{margin:2px 0 0;padding:0;list-style:none}
      .paper li{font-family:Georgia,serif;font-size:12.5px;line-height:1.5;color:#4a4036;padding:5px 0;border-bottom:1px solid #efe7d8}
      .paper li:last-child{border-bottom:none;padding-bottom:0}
      .paper li::before{content:"\201C";color:#c8b393;margin-right:2px}
      .paper li::after{content:"\201D";color:#c8b393;margin-left:2px}
      .rev{font-size:10px;opacity:.5;text-align:right;color:var(--mut);padding:0 14px 9px;margin:0}
      .sk{background:linear-gradient(90deg,var(--bd2) 25%,var(--bd) 50%,var(--bd2) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px}
      @keyframes sh{to{background-position:-200% 0}}
      .hidden{display:none !important}

  </head>
  <body>
    <div class="w">
      <div class="hd"><span class="logo"></span><b>Letter IRL</b><span class="ctx">About</span></div>
      <div class="bd">
        <!-- Skeleton until toolOutput arrives -->
        <div id="state-loading">
          <div class="sk" style="height:20px;width:70%"></div>
          <div class="sk" style="height:12px;margin-top:10px"></div>
          <div class="sk" style="height:12px;width:85%;margin-top:6px"></div>
          <div class="sk" style="height:74px;margin-top:12px;border-radius:10px"></div>
          <div class="sk" style="height:96px;margin-top:10px;border-radius:10px"></div>
        </div>
        <div id="state-ready" class="hidden">
          <h1 class="title" id="title">Get Started with Letter IRL</h1>
          <p class="ov" id="overview"></p>
          <div class="paper">
            <p class="plabel">Before You Send</p>
            <p class="ptext" id="purchase-step"></p>
          </div>
          <div class="paper">
            <p class="plabel">Try One Of These</p>
            <ul id="example-prompts"></ul>
          </div>
        </div>
      </div>
      <p class="rev">started t12</p>
    </div>

    <script>
      function applyTheme() {
        const theme = window.openai?.theme ?? "light";
        document.documentElement.classList.toggle("dark", theme === "dark");
      }

      function render() {
        applyTheme();
        const output = window.openai?.toolOutput ?? {};
        const responseMeta = window.openai?.toolResponseMetadata ?? {};
        const state = { ...responseMeta, ...output };

        const hasData = Boolean(
          state.overview || state.purchaseStep || (state.examplePrompts || []).length
        );
        document.getElementById("state-loading").classList.toggle("hidden", hasData);
        document.getElementById("state-ready").classList.toggle("hidden", !hasData);
        if (!hasData) return;

        document.getElementById("title").textContent =
          state.title || "Get Started with Letter IRL";
        document.getElementById("overview").textContent = state.overview || "";
        document.getElementById("purchase-step").textContent = state.purchaseStep || "";

        const list = document.getElementById("example-prompts");
        list.innerHTML = "";
        for (const prompt of state.examplePrompts || []) {
          const item = document.createElement("li");
          item.textContent = prompt;
          list.appendChild(item);
        }
      }

      window.addEventListener("openai:set_globals", render);
      render();
    </script>
  </body>
</html>
