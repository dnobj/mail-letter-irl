<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterConfirmationCard</title>
    <style>
      :root {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #102a43;
        background: #f8fafc;
      }

      body {
        margin: 0;
        padding: 1.5rem;
      }

      .card {
        max-width: 28rem;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 1.75rem;
        display: grid;
        gap: 1rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .status-icon {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        background: #d1fae5;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #065f46;
        font-size: 24px;
      }

      .recipient {
        font-size: 0.95rem;
        color: #61748f;
      }

      .credits {
        font-size: 0.95rem;
        font-weight: 600;
      }

      button {
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status">
        <span class="status-icon">✔</span>
        <div>
          <div class="headline">Letter queued for print</div>
          <div class="timestamp" id="status-text"></div>
        </div>
      </div>
      <div class="recipient" id="recipient"></div>
      <div class="credits" id="credits"></div>
      <button id="track-button">Track status</button>
    </div>

    <script type="module">
      const {
        orderId,
        currentStatus,
        recipientSummary,
        creditsRemaining
      } = window.renderContext?.data ?? {};

      const statusText = document.getElementById("status-text");
      statusText.textContent = `Current status: ${currentStatus}`;

      const recipient = document.getElementById("recipient");
      recipient.textContent = `To: ${recipientSummary?.name ?? "Recipient"} — ${recipientSummary?.city ?? "City"}, ${recipientSummary?.state ?? "State"}`;

      const credits = document.getElementById("credits");
      credits.textContent = `Remaining credits: ${creditsRemaining}`;

      const trackButton = document.getElementById("track-button");
      trackButton?.addEventListener("click", async () => {
        if (!window.openai?.callTool) return;
        await window.openai.callTool("get_order_status", { orderId });
      });
    </script>
  </body>
</html>
