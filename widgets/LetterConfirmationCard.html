<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterConfirmationCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #102a43;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-blue: #2563eb;
        --accent-blue-hover: #1d4ed8;
        --accent-success: #065f46;
        --accent-success-bg: #d1fae5;

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-blue: #3b82f6;
        --accent-blue-hover: #2563eb;
        --accent-success: #34d399;
        --accent-success-bg: #064e3b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .status-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .status-icon {
        width: 40px;
        height: 40px;
        border-radius: 20px;
        background: var(--accent-success-bg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-success);
        font-size: 20px;
        flex-shrink: 0;
      }

      .status-text {
        flex: 1;
      }

      .status-text .headline {
        font-weight: 600;
        font-size: 1rem;
        color: var(--text-primary);
      }

      .status-text .substatus {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 0.25rem;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
      }

      .info-row:last-of-type {
        border-bottom: none;
      }

      .info-label {
        color: var(--text-secondary);
      }

      .info-value {
        font-weight: 600;
        color: var(--text-primary);
        text-align: right;
      }

      .note {
        font-size: 0.85rem;
        color: var(--text-secondary);
        padding: 0.75rem;
        background: var(--bg-secondary);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .actions {
        padding-top: 0.5rem;
      }

      button {
        width: 100%;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        background: var(--accent-blue);
        color: #ffffff;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-blue-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-header">
        <span class="status-icon">✓</span>
        <div class="status-text">
          <div class="headline">Letter queued for print</div>
          <div class="substatus" id="status-text"></div>
        </div>
      </div>

      <div class="info-row">
        <span class="info-label">Order ID</span>
        <span class="info-value" id="order-id"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Recipient</span>
        <span class="info-value" id="recipient"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Credits remaining</span>
        <span class="info-value" id="credits"></span>
      </div>

      <div class="note" id="note" style="display: none;"></div>

      <div class="actions">
        <button id="track-button">Track status</button>
      </div>
    </div>

    <script type="module">
      // OpenAI Apps SDK injects window.openai with toolOutput data
      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      const {
        orderId,
        currentStatus,
        recipientSummary,
        creditsRemaining,
        saveReturnAddressNote
      } = window.openai?.toolOutput ?? {};

      // Status
      document.getElementById("status-text").textContent = currentStatus ?? "Processing";

      // Order ID (show short version)
      const shortOrderId = orderId ? orderId.substring(0, 8) + "..." : "—";
      document.getElementById("order-id").textContent = shortOrderId;

      // Recipient
      const recipientText = recipientSummary
        ? `${recipientSummary.name ?? ""}${recipientSummary.city ? `, ${recipientSummary.city}` : ""}${recipientSummary.state ? ` ${recipientSummary.state}` : ""}`
        : "—";
      document.getElementById("recipient").textContent = recipientText;

      // Credits
      document.getElementById("credits").textContent =
        typeof creditsRemaining === "number" ? creditsRemaining : "—";

      // Note about saving return address
      const noteEl = document.getElementById("note");
      if (saveReturnAddressNote) {
        noteEl.textContent = saveReturnAddressNote;
        noteEl.style.display = "block";
      }

      // Track button
      const trackButton = document.getElementById("track-button");
      trackButton?.addEventListener("click", async () => {
        if (!window.openai?.callTool || !orderId) return;
        trackButton.textContent = "Loading...";
        trackButton.disabled = true;
        try {
          await window.openai.callTool("get_order_status", { orderId });
        } catch (error) {
          console.error("Failed to get order status:", error);
          trackButton.textContent = "Track status";
          trackButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
