<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PostcardPreviewCard</title>
    <style>
      /* Letter IRL design system (widget-design-package, Aug 2026). The
         postcard back and message box are paper artifacts: cream in both
         themes - printed mail stays paper. */
      :root{--sf:#fff;--sf2:#fafafa;--bd:#e4e4e7;--bd2:#f0f0f2;--tx:#111113;--tb:#3f3f46;--mut:#71717a;--faint:#a1a1aa;--pri:#111113;--prit:#fff;--ok:#16a34a;--okbg:#f0fdf4;--er:#dc2626;--erbg:#fef2f2}
      .dark{--sf:#2a2a2e;--sf2:#232327;--bd:#3a3a40;--bd2:#323238;--tx:#f4f4f5;--tb:#d4d4d8;--mut:#a1a1aa;--faint:#71717a;--pri:#f4f4f5;--prit:#111113;--ok:#34d399;--okbg:rgba(52,211,153,.13);--er:#f87171;--erbg:rgba(248,113,113,.12)}
      *{box-sizing:border-box}
      body{margin:0;padding:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tb);overflow:hidden}
      .w{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;max-width:100%}
      .hd{display:flex;align-items:center;gap:7px;padding:11px 14px 10px;border-bottom:1px solid var(--bd2)}
      .logo{width:17px;height:11px;flex:none;display:block}
      /* One parametric SVG for both themes (assets/brand/letterirl-mark-small.svg):
         the mark reads --li-blue, which the dark scope lightens. */
      .dark{--li-blue:#6f98f2}
      .hd b{font-size:12.5px;font-weight:600;color:var(--tx)}
      .hd span.ctx{margin-left:auto;font-size:11.5px;color:var(--mut)}

      /* Preview tabs */
      .preview-tabs{display:flex;border-bottom:1px solid var(--bd2)}
      .preview-tab{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;background:transparent;border-top:none;border-left:none;border-right:none;cursor:pointer;font-family:inherit;transition:color .15s ease}
      .preview-tab:hover{color:var(--tx)}
      .preview-tab.active{color:var(--tx);border-bottom-color:var(--tx)}

      /* Preview panes */
      .preview-container{position:relative;overflow:hidden}
      .preview-pane{padding:14px 14px 0;overflow:hidden}
      .preview-pane.hidden{display:none !important}
      .preview-pane.front-preview{display:flex;justify-content:center;align-items:center}
      /* Override injected postcard-front styles (fixed pixel dimensions) */
      .postcard-front{width:100% !important;height:auto !important;max-width:100% !important}
      .postcard-front img{width:100% !important;height:auto !important;aspect-ratio:9/6;object-fit:cover}
      .preview-pane img{width:100%;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--bd);aspect-ratio:9/6;object-fit:cover}
      .preview-pane.back-preview{display:flex;justify-content:center;align-items:center}

      /* Postcard back mockup - paper artifact, cream in both themes */
      .postcard-back-mockup{width:100%;aspect-ratio:9/6;background:#fdfcf8;border:1px solid #e6e0d2;border-radius:8px;box-shadow:0 2px 8px rgba(43,36,29,.1);display:flex;overflow:hidden;color:#2b241d}
      .postcard-message-side{width:53%;padding:11px 12px;border-right:1px solid #e6e0d2;display:flex;align-items:flex-start}
      .postcard-message-text{font-family:Georgia,"Times New Roman",serif;font-size:9.5px;line-height:1.6;color:#4a4036;white-space:pre-wrap;word-wrap:break-word}
      .postcard-address-side{width:47%;padding:9px 10px;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
      .postcard-stamp{position:absolute;top:9px;right:10px;width:32px;height:38px;border:1.5px dashed #c8b393;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:6px;letter-spacing:.12em;color:#a8916b}
      .postcard-recipient{font-family:"Courier New",monospace;font-size:8.5px;line-height:1.5;color:#2b241d;text-transform:uppercase;margin-bottom:5px}
      .postcard-recipient .name{font-weight:700}
      .postcard-return-address{position:absolute;top:9px;left:10px;font-family:"Courier New",monospace;font-size:6.5px;line-height:1.45;color:#8a7a64;text-transform:uppercase}

      /* Meta info rows */
      .meta{padding:0 14px 14px}
      .rows{margin:12px 0 0}
      .info-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--bd2);font-size:12.5px}
      .info-row:last-of-type{border-bottom:none}
      .info-label{color:var(--mut);flex:none}
      .info-value{color:var(--tx);font-weight:500;text-align:right}
      .info-value.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
      .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px}
      .status-pill.ok{color:var(--ok);background:var(--okbg)}
      .status-pill.alert{color:var(--er);background:var(--erbg)}

      /* Paper message box */
      .message-box{background:#fdfcf8;border:1px solid #e6e0d2;border-radius:8px;padding:9px 11px;margin-top:11px}
      .message-box .info-label{margin-bottom:4px;display:block;font-size:11px}
      .message-text{font-family:Georgia,"Times New Roman",serif;font-size:11.5px;line-height:1.55;color:#4a4036;white-space:pre-wrap;word-wrap:break-word}

      .note{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--mut);line-height:1.45;margin-top:10px}

      /* Action buttons: primary ink pill (inverts in dark), secondary outline */
      .send-button{display:flex;width:100%;justify-content:center;align-items:center;gap:7px;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;box-sizing:border-box;border:none;margin-top:12px;background:var(--pri);color:var(--prit);transition:opacity .15s ease}
      .send-button:hover:not(:disabled){opacity:.88}
      .send-button:disabled{opacity:.45;cursor:not-allowed}
      .send-button.loading{pointer-events:none}
      .send-button .spinner{width:1rem;height:1rem;border:2px solid rgba(128,128,128,.35);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
      .purchase-actions{display:grid;gap:0}
      .send-button.secondary{color:var(--tx);background:transparent;border:1px solid var(--bd);margin-top:8px}
      .send-button.secondary:hover:not(:disabled){background:var(--sf2);opacity:1}
      @keyframes spin{to{transform:rotate(360deg)}}

      /* Success/Error states */
      .send-result{border-radius:8px;font-size:12px;line-height:1.5;text-align:center;padding:9px 11px;margin-top:11px}
      .send-result.success{background:var(--okbg);color:var(--ok)}
      .send-result.error{background:var(--erbg);border:1px solid rgba(220,38,38,.25);color:var(--er)}

      /* Loading shimmer */
      .loading .info-value,
      .loading .status-pill{background:linear-gradient(90deg,var(--bd2) 25%,var(--bd) 50%,var(--bd2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;color:transparent;border-radius:4px;min-width:60px}
      .loading .status-pill{min-width:100px}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      .preview-loading{display:flex;align-items:center;justify-content:center;min-height:100px;color:var(--faint);font-size:11.5px;width:100%}
      .rev{font-size:10px;opacity:.5;text-align:right;color:var(--mut);padding:0 14px 9px;margin:0}
      .hidden{display:none !important}
    </style>
  </head>
  <body>
    <div class="w" id="card">
      <div class="hd"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 21"><path fill="none" stroke="var(--li-blue,#2563eb)" stroke-width="3" stroke-linejoin="round" d="M11.3 2.4c5.2 0 9.4 3.3 9.4 7.4 0 4.1-4.2 7.4-9.4 7.4-.8 0-1.6-.1-2.4-.2l-5.7 2.6 1.8-4.1C3 14.2 1.9 12 1.9 9.8c0-4.1 4.2-7.4 9.4-7.4Z"></path><g transform="rotate(-8 24 8.6)"><rect x="16.5" y="3" width="14.6" height="10" rx="1.6" fill="var(--li-orange,#f97316)"></rect><path fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" d="m18 4.7 5.8 4 5.8-4"></path></g></svg></span><b>Letter IRL</b><span class="ctx">Postcard</span></div>
      <div class="preview-tabs">
        <button class="preview-tab active" id="tab-front" data-tab="front">
          Front (Image)
        </button>
        <button class="preview-tab" id="tab-back" data-tab="back">
          Back (Message)
        </button>
      </div>
      <div class="preview-container">
        <div class="preview-pane front-preview" id="preview-front">
          <div class="preview-loading">Loading postcard preview&hellip;</div>
        </div>
        <div class="preview-pane back-preview hidden" id="preview-back">
          <div class="preview-loading">Loading message preview&hellip;</div>
        </div>
      </div>
      <div class="meta">
        <div class="rows">
          <div class="info-row">
            <span class="info-label">Cost</span>
            <span class="info-value" id="cost"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Delivery</span>
            <span class="info-value" id="delivery"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="status-pill" id="status-pill"></span>
          </div>
          <div class="info-row">
            <span class="info-label" id="id-label">Draft</span>
            <span class="info-value mono" id="id-value"></span>
          </div>
          <div class="info-row" id="recipient-row" style="display: none">
            <span class="info-label">To</span>
            <span class="info-value" id="recipient-name"></span>
          </div>
        </div>
        <div class="message-box" id="message-box" style="display: none">
          <span class="info-label">Message</span>
          <div class="message-text" id="message-text"></div>
        </div>
        <div class="note" id="note" style="display: none"></div>
        <!-- Send button -->
        <button class="send-button" id="send-button" disabled>
          <span id="send-button-text">Send Postcard</span>
        </button>
        <div
          class="purchase-actions"
          id="purchase-actions"
          style="display: none"
        >
          <button class="send-button" id="pay-send-button">
            <span id="pay-send-button-text">Pay &amp; Send</span>
          </button>
          <button class="send-button secondary" id="buy-pack-button">
            Buy a Letter Pack
          </button>
          <div class="note">Checkout opens in your browser. This card updates automatically once payment completes.</div>
        </div>
        <div
          id="error-message"
          class="send-result error"
          style="display: none"
        ></div>
      </div>
      <p class="rev">postcard t14</p>
    </div>

    <script type="module">
      // Per OpenAI docs, data may not be available immediately
      // Must listen for 'openai:set_globals' event

      let dataLoaded = false;
      let currentDraftId = null;
      let currentEligibility = null;
      let sendInProgress = false;
      let checkoutInProgress = false;
      let currentTab = "front";

      function applyTheme() {
        const theme = window.openai?.theme ?? "light";
        document.documentElement.classList.toggle("dark", theme === "dark");
      }

      // Tab switching
      function switchTab(tab) {
        currentTab = tab;
        document
          .getElementById("tab-front")
          .classList.toggle("active", tab === "front");
        document
          .getElementById("tab-back")
          .classList.toggle("active", tab === "back");
        document
          .getElementById("preview-front")
          .classList.toggle("hidden", tab !== "front");
        document
          .getElementById("preview-back")
          .classList.toggle("hidden", tab !== "back");
      }

      document
        .getElementById("tab-front")
        .addEventListener("click", () => switchTab("front"));
      document
        .getElementById("tab-back")
        .addEventListener("click", () => switchTab("back"));

      function showLoading() {
        const card = document.getElementById("card");
        card.classList.add("loading");

        // Show loading state
        document.getElementById("preview-front").innerHTML =
          '<div class="preview-loading">Loading postcard preview…</div>';
        document.getElementById("preview-back").innerHTML =
          '<div class="preview-loading">Loading message preview…</div>';
        document.getElementById("cost").textContent = "-";
        document.getElementById("delivery").textContent = "-";

        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        statusPill.textContent = "Loading...";

        document.getElementById("note").style.display = "none";

        // Disable send button during loading
        const sendButton = document.getElementById("send-button");
        sendButton.disabled = true;
      }

      function extractBodyContent(html) {
        if (!html) return null;
        const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        return bodyMatch ? bodyMatch[1] : html;
      }

      function render() {
        applyTheme();
        const state = window.openai?.toolOutput;

        // Check if we have actual data
        if (!state || state.draftId === undefined) {
          if (!dataLoaded) {
            showLoading();
          }
          return;
        }

        dataLoaded = true;
        const card = document.getElementById("card");
        card.classList.remove("loading");

        // Get preview HTML from toolResponseMetadata or toolOutput
        const previewFrontHtml =
          window.openai?.toolResponseMetadata?.previewFrontHtml ??
          state.previewFrontHtml;
        const previewBackHtml =
          window.openai?.toolResponseMetadata?.previewBackHtml ??
          state.previewBackHtml;

        const {
          lettersRequired,
          canSendNow,
          reasonCannotSend,
          sendEligibility,
          deliveryClass,
          estimatedDeliveryDays,
          deliveryEstimate,
          deliveryDisclaimer,
          savedReturnAddressNote,
          draftId,
          message,
          recipientName,
          recipientAddressLine1,
          recipientAddressLine2,
          recipientCity,
          recipientState,
          recipientPostalCode,
          senderName,
          senderAddressLine1,
          senderAddressLine2,
          senderCity,
          senderState,
          senderPostalCode,
        } = state;

        // Store draftId for send button
        currentDraftId = draftId;
        currentEligibility = sendEligibility || null;

        // Render front preview (image)
        const previewFront = document.getElementById("preview-front");
        const frontContent = extractBodyContent(previewFrontHtml);
        if (frontContent) {
          previewFront.innerHTML = frontContent;
        } else {
          previewFront.innerHTML = '<div class="preview-loading">No image preview available</div>';
        }

        // Render back preview (postcard mockup)
        const previewBack = document.getElementById("preview-back");
        if (message) {
          // Escape HTML helper
          const escapeHtml = (str) =>
            (str || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");

          const escapedMessage = escapeHtml(message);

          // Build full recipient address
          const escapedRecipientName = escapeHtml(recipientName || "Recipient");
          const escapedRecipientStreet = escapeHtml(
            recipientAddressLine1 || "",
          );
          const escapedRecipientUnit = escapeHtml(recipientAddressLine2 || "");
          const escapedRecipientCityLine = escapeHtml(
            [recipientCity, recipientState, recipientPostalCode]
              .filter(Boolean)
              .join(", ")
              .replace(/, (\d)/, " $1"),
          );

          // Build full sender address
          const escapedSenderName = escapeHtml(senderName);
          const escapedSenderStreet = escapeHtml(senderAddressLine1 || "");
          const escapedSenderUnit = escapeHtml(senderAddressLine2 || "");
          const escapedSenderCityLine = escapeHtml(
            [senderCity, senderState, senderPostalCode]
              .filter(Boolean)
              .join(", ")
              .replace(/, (\d)/, " $1"),
          );

          previewBack.innerHTML = `
            <div class="postcard-back-mockup">
              <div class="postcard-message-side">
                <div class="postcard-message-text">${escapedMessage}</div>
              </div>
              <div class="postcard-address-side">
                <div class="postcard-stamp">STAMP</div>
                ${
                  escapedSenderName
                    ? `
                <div class="postcard-return-address">
                  <div>${escapedSenderName}</div>
                  <div>${escapedSenderStreet}</div>
                  ${escapedSenderUnit ? `<div>${escapedSenderUnit}</div>` : ""}
                  <div>${escapedSenderCityLine}</div>
                </div>
                `
                    : ""
                }
                <div class="postcard-recipient">
                  <div class="name">${escapedRecipientName}</div>
                  <div>${escapedRecipientStreet}</div>
                  ${escapedRecipientUnit ? `<div>${escapedRecipientUnit}</div>` : ""}
                  <div>${escapedRecipientCityLine}</div>
                </div>
              </div>
            </div>
          `;
        } else {
          previewBack.innerHTML = '<div class="preview-loading">No message preview available</div>';
        }

        // Show message and recipient in meta section
        if (message) {
          const messageBox = document.getElementById("message-box");
          const messageText = document.getElementById("message-text");
          messageText.textContent = message;
          messageBox.style.display = "block";
        }

        if (recipientName) {
          const recipientRow = document.getElementById("recipient-row");
          document.getElementById("recipient-name").textContent = recipientName;
          recipientRow.style.display = "flex";
        }

        // Cost - lettersRequired is already in letters (1 letter = 1 postcard)
        const letters = lettersRequired ?? 1;
        document.getElementById("cost").textContent =
          `${letters} Letter${letters === 1 ? "" : "s"}`;

        // Delivery info
        const deliveryText = [];
        if (deliveryClass) deliveryText.push(deliveryClass);
        if (deliveryEstimate) {
          deliveryText.push(deliveryEstimate);
        } else if (estimatedDeliveryDays) {
          deliveryText.push(`~${estimatedDeliveryDays} days`);
        }
        if (deliveryDisclaimer) deliveryText.push(deliveryDisclaimer);
        document.getElementById("delivery").textContent =
          deliveryText.length > 0 ? deliveryText.join(" - ") : "Standard";

        // Status pill
        const statusPill = document.getElementById("status-pill");
        statusPill.classList.remove("ok", "alert");
        if (canSendNow) {
          statusPill.classList.add("ok");
          statusPill.textContent = "Ready to send";
        } else {
          statusPill.classList.add("alert");
          statusPill.textContent = reasonCannotSend ?? "Cannot send";
        }

        // Note about saved return address
        const noteEl = document.getElementById("note");
        if (savedReturnAddressNote) {
          noteEl.textContent = savedReturnAddressNote;
          noteEl.style.display = "block";
        } else {
          noteEl.style.display = "none";
        }

        // Show Draft ID
        document.getElementById("id-label").textContent = "Draft";
        document.getElementById("id-value").textContent = draftId || "-";

        // Update send button state
        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const purchaseActions = document.getElementById("purchase-actions");
        const paySendButton = document.getElementById("pay-send-button");
        const paySendButtonText = document.getElementById(
          "pay-send-button-text",
        );
        const buyPackButton = document.getElementById("buy-pack-button");

        if (!sendInProgress && !checkoutInProgress) {
          sendButton.style.display = canSendNow ? "flex" : "none";
          sendButton.disabled = !canSendNow;
          sendButtonText.textContent = "Send Postcard";

          const payAndSend = sendEligibility?.payAndSend;
          const letterPack = sendEligibility?.letterPack;
          purchaseActions.style.display =
            !canSendNow || payAndSend?.available ? "grid" : "none";
          paySendButton.style.display = payAndSend?.available ? "flex" : "none";
          paySendButton.disabled = !payAndSend?.available;
          if (payAndSend?.available && payAndSend.amountCents) {
            // Server-formatted per currency; /100 is a legacy-server fallback
            // and is 100x wrong for zero-decimal currencies (#278 round 6).
            const amount = payAndSend.displayAmount || (payAndSend.amountCents / 100).toFixed(2);
            paySendButtonText.textContent = `Pay & Send (${String(payAndSend.currency || "usd").toUpperCase()} ${amount})`;
          }
          buyPackButton.style.display =
            !canSendNow && letterPack?.available ? "flex" : "none";
        }
      }

      // Handle send button click
      async function handleSend() {
        if (sendInProgress || !currentDraftId) return;

        const sendButton = document.getElementById("send-button");
        const sendButtonText = document.getElementById("send-button-text");
        const statusPill = document.getElementById("status-pill");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        const errorMessage = document.getElementById("error-message");

        // Hide any previous error
        errorMessage.style.display = "none";

        // NOTE: We intentionally do NOT call sendFollowUpMessage here.
        // As of Dec 2025, sendFollowUpMessage has a bug that causes the widget
        // to re-render by replaying the prior tool response. See GitHub issue.
        // The widget UI shows success state; users can ask ChatGPT for status if needed.

        // Show loading state
        sendInProgress = true;
        sendButton.disabled = true;
        sendButton.classList.add("loading");
        sendButtonText.innerHTML = '<span class="spinner"></span> Sending...';

        try {
          // Call send_postcard via OpenAI callTool
          const result = await window.openai.callTool("send_postcard", {
            draftId: currentDraftId,
            confirm: true,
          });

          // Extract orderId
          const orderId =
            result?.orderId ||
            result?.structuredContent?.orderId ||
            result?.content?.[0]?.text?.match(/Order ID: ([a-f0-9-]+)/i)?.[1] ||
            null;

          // Update status pill to show sent
          statusPill.classList.remove("ok", "alert");
          statusPill.classList.add("ok");
          statusPill.textContent = "Sent!";

          // Change Draft label to Order and show order ID
          idLabel.textContent = "Order";
          idValue.textContent = orderId || "Confirmed";

          // Update button to show success
          sendButton.classList.remove("loading");
          sendButtonText.innerHTML = "Postcard Sent!";
          // Keep button disabled
        } catch (error) {
          // Show error message
          errorMessage.textContent = `Failed to send: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";

          // Reset button for retry
          sendButton.classList.remove("loading");
          sendButton.disabled = false;
          sendButtonText.textContent = "Retry Send";

          // Update status pill to alert state
          statusPill.classList.remove("ok");
          statusPill.classList.add("alert");
          statusPill.textContent = "Send failed";

          sendInProgress = false;
        }
      }

      function toolData(result) {
        return result?.structuredContent || result || {};
      }

      async function pollPurchaseStatus(orderId) {
        const statusPill = document.getElementById("status-pill");
        for (let attempt = 0; attempt < 24; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, 2500));
          const status = toolData(
            await window.openai.callTool("get_purchase_status", { orderId }),
          );
          if (status.purchaseStatus === "processing") {
            statusPill.classList.remove("alert");
            statusPill.classList.add("ok");
            statusPill.textContent = "Paid - preparing mail";
            continue;
          }
          if (status.purchaseStatus === "sent") {
            statusPill.classList.remove("alert");
            statusPill.classList.add("ok");
            statusPill.textContent = "Sent!";
            return;
          }
          if (
            [
              "payment_failed",
              "refund_pending",
              "refunded",
              "cancelled",
            ].includes(status.purchaseStatus)
          ) {
            statusPill.classList.remove("ok");
            statusPill.classList.add("alert");
            statusPill.textContent = status.message || status.purchaseStatus;
            return;
          }
        }
        statusPill.textContent = "Checkout open - status may take a moment";
      }

      async function handlePayAndSend() {
        if (checkoutInProgress || !currentDraftId) return;
        const button = document.getElementById("pay-send-button");
        const buttonText = document.getElementById("pay-send-button-text");
        const errorMessage = document.getElementById("error-message");
        const idLabel = document.getElementById("id-label");
        const idValue = document.getElementById("id-value");
        checkoutInProgress = true;
        errorMessage.style.display = "none";
        button.disabled = true;
        button.classList.add("loading");
        buttonText.innerHTML =
          '<span class="spinner"></span> Preparing checkout...';
        try {
          const result = toolData(
            await window.openai.callTool("create_mail_checkout", {
              draftId: currentDraftId,
            }),
          );
          if (!result.checkoutUrl) {
            throw new Error(result.message || "Checkout URL was not returned");
          }
          idLabel.textContent = "Purchase";
          idValue.textContent = result.orderId;
          button.classList.remove("loading");
          buttonText.textContent = "Checkout Opened";
          await window.openai.openExternal({ href: result.checkoutUrl });
          void pollPurchaseStatus(result.orderId).catch(() => undefined);
        } catch (error) {
          errorMessage.textContent = `Unable to open checkout: ${error.message || "Unknown error"}`;
          errorMessage.style.display = "block";
          button.classList.remove("loading");
          button.disabled = false;
          buttonText.textContent = "Retry Pay & Send";
          checkoutInProgress = false;
        }
      }

      async function handleBuyPack() {
        const purchaseUrl = currentEligibility?.letterPack?.purchaseUrl;
        if (!purchaseUrl) return;
        await window.openai.openExternal({ href: purchaseUrl });
      }

      // Attach click handler
      document
        .getElementById("send-button")
        .addEventListener("click", handleSend);
      document
        .getElementById("pay-send-button")
        .addEventListener("click", handlePayAndSend);
      document
        .getElementById("buy-pack-button")
        .addEventListener("click", handleBuyPack);

      // Initial render (will show loading state)
      render();

      // Listen for data updates (per OpenAI docs)
      window.addEventListener("openai:set_globals", () => {
        render();
      });
    </script>
  </body>
</html>
