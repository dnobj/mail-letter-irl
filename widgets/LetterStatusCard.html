<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LetterStatusCard</title>
    <style>
      :root {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #102a43;
      }

      body {
        margin: 0;
        padding: 1.5rem;
      }

      .card {
        max-width: 34rem;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 1.75rem;
        display: grid;
        gap: 1.5rem;
      }

      .preview {
        padding: 1rem;
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        background: #fdfdfd;
      }

      .timeline {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .timeline li {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
      }

      .timeline time {
        font-size: 0.8rem;
        color: #829ab1;
        min-width: 7rem;
      }

      button {
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #ffffff;
      }

      button.secondary {
        background: #e0e7ff;
        color: #1e3a8a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="heading" id="status-heading"></div>
      <div class="preview" id="preview"></div>
      <ul class="timeline" id="timeline"></ul>
      <button id="follow-up" class="secondary">Send follow-up letter</button>
    </div>

    <script type="module">
      // OpenAI Apps SDK injects window.openai with toolOutput data
      const {
        orderId,
        currentStatus,
        statusTimeline = [],
        previewThumbnailHtml,
        canSendFollowUp,
        followUpSuggestedPrompt
      } = window.openai?.toolOutput ?? {};

      const heading = document.getElementById("status-heading");
      heading.textContent = `Order ${orderId} — ${currentStatus}`;

      const preview = document.getElementById("preview");
      preview.innerHTML = previewThumbnailHtml ?? "Preview unavailable.";

      const timeline = document.getElementById("timeline");
      statusTimeline.forEach((entry) => {
        const li = document.createElement("li");
        const time = document.createElement("time");
        time.textContent = entry.timestampISO;
        const status = document.createElement("span");
        status.textContent = entry.statusText;
        li.appendChild(time);
        li.appendChild(status);
        timeline.appendChild(li);
      });

      const followUpButton = document.getElementById("follow-up");
      if (!canSendFollowUp) {
        followUpButton.disabled = true;
        followUpButton.textContent = "Follow-up unavailable";
      }

      followUpButton?.addEventListener("click", async () => {
        if (!window.openai?.sendFollowUpMessage || !followUpSuggestedPrompt) {
          return;
        }

        await window.openai.sendFollowUpMessage({
          role: "user",
          content: followUpSuggestedPrompt
        });
      });
    </script>
  </body>
</html>
