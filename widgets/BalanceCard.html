<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BalanceCard</title>
    <style>
      :root {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #102a43;
      }

      body {
        margin: 0;
        padding: 1.5rem;
      }

      .card {
        max-width: 24rem;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 1.75rem;
        display: grid;
        gap: 1rem;
      }

      .balance {
        font-size: 2.5rem;
        font-weight: 700;
      }

      .message {
        font-size: 0.95rem;
        color: #61748f;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-pill.ok {
        background: #d1fae5;
        color: #065f46;
      }

      .status-pill.alert {
        background: #fee2e2;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="balance" id="balance"></div>
      <div class="status-pill" id="status-pill"></div>
      <div class="message" id="message"></div>
    </div>

    <script type="module">
      // OpenAI Apps SDK injects window.openai with toolOutput data
      const {
        creditsRemaining,
        canSendStandardLetter,
        standardLetterCostCredits,
        message
      } = window.openai?.toolOutput ?? {};

      document.getElementById("balance").textContent = `Credits: ${creditsRemaining ?? 0}`;

      const pill = document.getElementById("status-pill");
      if (canSendStandardLetter) {
        pill.classList.add("ok");
        pill.textContent = `Standard letter costs ${standardLetterCostCredits ?? 1} credit`;
      } else {
        pill.classList.add("alert");
        pill.textContent = "Add credits to send a letter";
      }

      document.getElementById("message").textContent = message ?? "";
    </script>
  </body>
</html>
