<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BalanceCard</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #102a43;
        --text-secondary: #61748f;
        --border-color: #e2e8f0;
        --accent-success: #065f46;
        --accent-success-bg: #d1fae5;
        --accent-warning: #b91c1c;
        --accent-warning-bg: #fee2e2;
        --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: var(--text-primary);
      }

      .dark {
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent-success: #34d399;
        --accent-success-bg: #064e3b;
        --accent-warning: #f87171;
        --accent-warning-bg: #7f1d1d;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: transparent;
      }

      .card {
        width: 100%;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .balance {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        width: fit-content;
      }

      .status-pill.ok {
        background: var(--accent-success-bg);
        color: var(--accent-success);
      }

      .status-pill.alert {
        background: var(--accent-warning-bg);
        color: var(--accent-warning);
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        color: var(--text-secondary);
      }

      .info-value {
        font-weight: 600;
        color: var(--text-primary);
      }

      .account-info {
        font-size: 0.85rem;
        color: var(--text-secondary);
        padding-top: 0.5rem;
        border-top: 1px solid var(--border-color);
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="balance" id="balance"></div>
      <div class="status-pill" id="status-pill"></div>
      <div class="info-row">
        <span class="info-label">Letter cost</span>
        <span class="info-value" id="letter-cost"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Can send</span>
        <span class="info-value" id="can-send"></span>
      </div>
      <div class="account-info" id="account-info"></div>
    </div>

    <script type="module">
      // Debug: Log what window.openai contains
      console.log("[BalanceCard] window.openai:", window.openai);
      console.log("[BalanceCard] window.openai?.toolOutput:", window.openai?.toolOutput);
      console.log("[BalanceCard] Keys:", window.openai ? Object.keys(window.openai) : "undefined");

      // OpenAI Apps SDK injects window.openai with toolOutput data
      const theme = window.openai?.theme ?? "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }

      const toolOutput = window.openai?.toolOutput ?? {};
      console.log("[BalanceCard] toolOutput:", JSON.stringify(toolOutput, null, 2));

      const {
        creditsRemaining,
        canSendStandardLetter,
        standardLetterCostCredits,
        userEmail,
        authProvider
      } = toolOutput;

      console.log("[BalanceCard] creditsRemaining:", creditsRemaining);

      document.getElementById("balance").textContent = `${creditsRemaining ?? 0} credits`;
      document.getElementById("letter-cost").textContent = `${standardLetterCostCredits ?? 2} credits`;
      document.getElementById("can-send").textContent = canSendStandardLetter ? "Yes" : "No";

      const pill = document.getElementById("status-pill");
      if (canSendStandardLetter) {
        pill.classList.add("ok");
        pill.textContent = "Ready to send";
      } else {
        pill.classList.add("alert");
        pill.textContent = "Need more credits";
      }

      const accountInfo = document.getElementById("account-info");
      if (userEmail) {
        accountInfo.textContent = `Signed in as ${userEmail}${authProvider ? ` (${authProvider})` : ""}`;
      } else {
        accountInfo.style.display = "none";
      }
    </script>
  </body>
</html>
