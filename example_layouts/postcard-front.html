<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Postcard Front - Letter IRL</title>
  <style>
    /* Page setup for 6x4 postcard preview */
    html, body {
      margin: 0;
      padding: 0;
      background: #888;
    }

    .page {
      width: 6in;
      height: 4in;
      background: white;
      margin: 0.5in auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    /* Full-bleed image */
    .postcard-image {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg,
        #87CEEB 0%,
        #87CEEB 40%,
        #228B22 40%,
        #228B22 70%,
        #8B4513 70%,
        #8B4513 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Simple mountain scene mockup */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .sun {
      position: absolute;
      top: 15%;
      right: 20%;
      width: 50px;
      height: 50px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 30px #FFD700;
    }

    .mountain {
      position: absolute;
      bottom: 30%;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .mountain.m1 {
      left: 10%;
      border-width: 0 80px 120px 80px;
      border-color: transparent transparent #4a5568 transparent;
    }

    .mountain.m2 {
      left: 35%;
      border-width: 0 100px 150px 100px;
      border-color: transparent transparent #2d3748 transparent;
    }

    .mountain.m3 {
      right: 10%;
      border-width: 0 70px 100px 70px;
      border-color: transparent transparent #4a5568 transparent;
    }

    .snow {
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .snow.s2 {
      left: calc(35% + 50px);
      bottom: calc(30% + 120px);
      border-width: 0 50px 30px 50px;
      border-color: transparent transparent white transparent;
    }

    .trees {
      position: absolute;
      bottom: 15%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 10%;
    }

    .tree {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 40px solid #006400;
    }

    /* Text overlay */
    .overlay-text {
      position: absolute;
      bottom: 10%;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-family: 'Georgia', serif;
      font-size: 24pt;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* Layout label */
    .layout-label {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e74c3c;
      color: white;
      padding: 4px 12px;
      font-family: Arial, sans-serif;
      font-size: 10pt;
      border-radius: 4px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="layout-label">POSTCARD FRONT</div>

    <div class="postcard-image">
      <div class="scene">
        <div class="sun"></div>
        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
        <div class="snow s2"></div>
        <div class="mountain m3"></div>
        <div class="trees">
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
        </div>
        <div class="overlay-text">Greetings from Colorado!</div>
      </div>
    </div>
  </div>
</body>
</html>
