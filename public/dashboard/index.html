<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter IRL - Dashboard</title>
  <link rel="stylesheet" href="/dashboard/css/styles.css">
</head>
<body>
  <div class="container login-container">
    <div class="login-box">
      <div class="logo">✉️</div>
      <h1>Letter IRL</h1>
      <p class="subtitle">Send physical letters through ChatGPT</p>
      <button class="btn btn-primary" onclick="login()">Sign In with Auth0</button>
      <p style="margin-top: 20px; color: #999; font-size: 12px;">
        New to Letter IRL? Signing in will create your account automatically.
      </p>
    </div>
  </div>

  <script>
    function login() {
      // Redirect to Auth0 login endpoint
      window.location.href = '/auth/login?returnTo=/dashboard/app.html';
    }
  </script>
</body>
</html>
