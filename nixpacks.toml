# Railway/Nixpacks configuration for compiled production JavaScript.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

# libuv's thread pool (#730): decodes, fs, crypto, zlib and the lookups for
# the database, Stripe, PostGrid and Auth0 share it. Four threads let a few
# slow jobs stall the rest. Read when the process starts, so it is set here.
[variables]
UV_THREADPOOL_SIZE = "16"

[start]
cmd = "npm start"

